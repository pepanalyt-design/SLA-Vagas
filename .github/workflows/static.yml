    <script>
        // Init & Variaveis Globais Supabase REST
        const SUPABASE_URL = 'https://ueicrehzfrwewgteqxvi.supabase.co/rest/v1';
        const SUPABASE_KEY = 'sb_publishable_2TR1oEEywsdfai5_Vf5Aaw_OUNayOh9';
        const headers = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' };

        // CONFIGURAÇÃO OFICIAL AWS SDK - Para uploads nativos em Buckets S3
        AWS.config.update({
            accessKeyId: 'd3c2e0c7dab5fb0a6fef90b0b00ced00',
            secretAccessKey: 'fb4ae604793a5baceb384a7338f973a3df6b454399382131dd4dbacedece62fb',
            region: 'sa-east-1'
        });

        const s3Client = new AWS.S3({
            endpoint: 'https://ueicrehzfrwewgteqxvi.storage.supabase.co/storage/v1/s3',
            s3ForcePathStyle: true,
            signatureVersion: 'v4'
        });

        let currentUser = null; let allUsers = []; let rawData = []; let filteredData = []; let activeFilters = {}; 
        let selectedVaga = null; let mainChart = null; let currentActionType = null;
        let selectedFile = null; let avatarFile = null; let silentUpdateInterval = null;
        let currentTabFilter = 'todas'; 
        let selectedVagas = new Set(); // ids das vagas selecionadas na tabela
        
        // Notificações agora vivem na tabela tbl_notifications (não mais no localStorage),
        // então funcionam entre dispositivos/navegadores diferentes do mesmo usuário.
        let notifsHistory = []; 
        
        Chart.register(ChartDataLabels);
        Chart.defaults.set('plugins.datalabels', { color: '#000000', backgroundColor: '#ffffff', borderRadius: 4, font: { weight: 'bold' }, padding: 6 });

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('loginForm').addEventListener('submit', handleLogin);
            document.addEventListener('click', (e) => { if(!e.target.closest('th')) { document.querySelectorAll('.excel-filter-modal').forEach(m => m.classList.remove('open')); } });
            checkSession();
        });

        function togglePasswordVisibility() { const p = document.getElementById('login-senha'); p.type = p.type === 'password' ? 'text' : 'password'; }
        
        async function handleLogin(e) {
            e.preventDefault(); const ident = document.getElementById('login-email-user').value.trim().toLowerCase(); const pwd = document.getElementById('login-senha').value.trim();
            try {
                const res = await fetch(`${SUPABASE_URL}/usuarios?select=*`, { headers }); const users = await res.json(); allUsers = users;
                const user = users.find(u => ((u.email_usuario||"").toLowerCase() === ident || (u.usuario||"").toLowerCase() === ident) && u.senha_user === pwd);
                if (user) { currentUser = user; sessionStorage.setItem('sla_user', JSON.stringify(currentUser)); initApp(); } 
                else showToast("Credenciais inválidas.", true);
            } catch (err) { showToast("Erro de conexão.", true); }
        }
        
        async function checkSession() { 
            const saved = sessionStorage.getItem('sla_user'); 
            if (saved) { currentUser = JSON.parse(saved); fetch(`${SUPABASE_URL}/usuarios?select=*`, { headers }).then(r=>r.json()).then(d=>allUsers=d); initApp(); } 
        }

        function initApp() {
            document.getElementById('login-overlay').style.display = 'none'; document.getElementById('app-container').style.display = 'block';
            document.getElementById('header-name').innerText = currentUser.usuario; document.getElementById('header-role').innerText = currentUser.nivel_permissao || 'Operacional';
            loadPreferences(); buildTableHeaders(); loadGrupos().then(() => { atualizarVisibilidadeAdmin(); loadVagas(true); });
            startPolling();
        }

        // Polling automático de fundo — pensado pra economizar banda (egress) do plano
        // do Supabase: intervalo maior (5 min, em vez de 1) e pausa quando a aba não
        // está em foco (a maior parte da economia vem daqui, já que muita gente deixa
        // o app aberto numa aba em segundo plano o dia todo sem estar olhando).
        const POLLING_INTERVAL_MS = 5 * 60 * 1000; // 5 minutos

        function pollAgora() {
            loadVagas(false);
            if (isUserAdmin(currentUser)) refreshSolicBadge();
        }

        function startPolling() {
            if (silentUpdateInterval) clearInterval(silentUpdateInterval);
            silentUpdateInterval = setInterval(() => {
                if (document.visibilityState !== 'visible') return; // aba em segundo plano: não gasta banda
                pollAgora();
            }, POLLING_INTERVAL_MS);
        }

        // Ao voltar pra aba, atualiza na hora — assim o intervalo maior não faz
        // os dados parecerem desatualizados quando a pessoa volta a olhar o app.
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && currentUser) pollAgora();
        });

        // --- GRUPOS DE RECRUTAMENTO ---
        let allGroups = []; // [{id, nome, is_admin}]

        async function loadGrupos() {
            try {
                const [resGrupos, resHeart] = await Promise.all([
                    fetch(`${SUPABASE_URL}/grupos_recrutamento?select=*`, { headers }),
                    fetch(`${SUPABASE_URL}/tabela_heart_fact?select=grupos_recrutamento&grupos_recrutamento=not.is.null`, { headers })
                ]);
                const grupos = await resGrupos.json();
                const heartRows = await resHeart.json();

                const nomesExplicitos = Array.isArray(grupos) ? grupos : [];
                const nomesDaHeartFact = new Set();
                (Array.isArray(heartRows) ? heartRows : []).forEach(r => { if (r.grupos_recrutamento && r.grupos_recrutamento.trim()) nomesDaHeartFact.add(r.grupos_recrutamento.trim()); });

                // Mescla: começa pelos grupos "de verdade" (ex: Administrador), e adiciona
                // como itens somente-leitura os nomes que só existem na heart_fact.
                const nomesJaListados = new Set(nomesExplicitos.map(g => g.nome));
                const extras = Array.from(nomesDaHeartFact).filter(n => !nomesJaListados.has(n)).map(nome => ({ id: null, nome, is_admin: false, somenteLeitura: true }));

                allGroups = [...nomesExplicitos, ...extras];
            } catch(e) { console.error('Erro ao carregar grupos', e); allGroups = []; }
        }

        function getUserGroupNames(user) {
            if (!user || !user.grupos_recrutamento) return [];
            return user.grupos_recrutamento.split(';').map(g => g.trim()).filter(Boolean);
        }

        function isUserAdmin(user) {
            if (!user) return false;
            if (user.nivel_permissao && user.nivel_permissao !== 'Recrutadora') return true; // compatibilidade com o nível de permissão existente
            const myGroups = getUserGroupNames(user);
            return allGroups.some(g => g.is_admin && myGroups.includes(g.nome));
        }

        function atualizarVisibilidadeAdmin() {
            const admin = isUserAdmin(currentUser);
            document.getElementById('btnSolicitacoes').style.display = admin ? 'inline-flex' : 'none';
            document.getElementById('btnGrupos').style.display = admin ? 'inline-flex' : 'none';
            if (admin) refreshSolicBadge();
        }

        // --- CORE: REGRA DE ACESSO A DADOS ---
        // Vaga sem grupo (grupo_atribuido vazio) = visível pra todo mundo.
        // Vaga com grupo = visível só pra quem está naquele grupo (ou já é dona dela).
        // Administrador (grupo com is_admin) vê tudo, sempre.
        function getUserRawData() {
            if (!currentUser) return [];
            if (isUserAdmin(currentUser)) return rawData;

            const myUsuario = (currentUser.usuario || '').toLowerCase();
            const myGroups = getUserGroupNames(currentUser);

            return rawData.filter(v => {
                if (!v.grupo_atribuido || v.grupo_atribuido.trim() === '') return true; // vaga aberta a todos
                if (myGroups.includes(v.grupo_atribuido)) return true; // sou do grupo dono da vaga
                if ((v.recrutadora_responsavel || '').toLowerCase() === myUsuario) return true; // eu já sou dona, mesmo que o grupo tenha mudado depois
                return false;
            });
        }

        // --- HELPERS DE REQUISIÇÃO (evitam falhas silenciosas de RLS/PATCH) ---
        // Quando o Supabase bloqueia um UPDATE por causa de RLS, ele responde 200 OK
        // com um array vazio [] (não um erro). Por isso todo PATCH aqui verifica
        // explicitamente se alguma linha voltou - senão, lança erro de verdade.
        async function patchSupabase(table, idFilter, payload) {
            const res = await fetch(`${SUPABASE_URL}/${table}?${idFilter}`, {
                method: 'PATCH', headers, body: JSON.stringify(payload)
            });
            let data = null;
            try { data = await res.json(); } catch(e) { /* resposta sem corpo */ }

            if (!res.ok) {
                throw new Error((data && data.message) || `Falha na requisição (HTTP ${res.status}).`);
            }
            if (!Array.isArray(data) || data.length === 0) {
                throw new Error('Nenhuma linha foi atualizada. Verifique a política de UPDATE (RLS) desta tabela no Supabase, ou se o filtro de ID está correto.');
            }
            return data[0];
        }

        // Preferências & Avatar — agora persistidas no banco (usuarios + tbl_user_preferences),
        // não mais no localStorage. Isso faz as preferências acompanharem o usuário entre
        // dispositivos/navegadores diferentes.
        const STATUS_MAP = { aberta: 'Aberta', standby: 'Stand-by', admissao: 'Aguardando Admissão', fechada: 'Fechada', cancelada: 'Cancelada', desistencia: 'Desistência' };

        async function loadPreferences() {
            // Tema/fonte/emoji/conforto ocular são 1 valor por usuário -> colunas simples em "usuarios"
            const theme = currentUser.tema || 'light'; previewTheme(theme); document.getElementById('pref-theme').value = theme;
            const font = currentUser.fonte || "'Inter', sans-serif"; previewFont(font); document.getElementById('pref-font').value = font;
            document.getElementById('pref-emoji').value = currentUser.emoji_vitoria || '';
            document.body.classList.toggle('eye-comfort', !!currentUser.eye_comfort);

            // Cores por status ficam em tbl_user_preferences (1 linha por usuário+status)
            let colorPrefs = {};
            try {
                const res = await fetch(`${SUPABASE_URL}/tbl_user_preferences?usuario_id=eq.${currentUser.id}&select=status_vaga,cor_fundo_hex`, { headers });
                const rows = await res.json();
                if (Array.isArray(rows)) rows.forEach(r => colorPrefs[r.status_vaga] = r.cor_fundo_hex);
            } catch(e) { console.error('Erro ao carregar cores de preferência:', e); }

            Object.keys(STATUS_MAP).forEach(st => {
                const defaultColor = getComputedStyle(document.documentElement).getPropertyValue(`--st-${st}`).trim();
                const color = colorPrefs[STATUS_MAP[st]] || defaultColor;
                document.documentElement.style.setProperty(`--st-${st}`, color);
                document.getElementById(`pref-st-${st}`).value = color;
            });

            const defAv = `https://ui-avatars.com/api/?name=${encodeURIComponent(currentUser.usuario)}&background=0ea5e9&color=fff`;
            const avUrl = currentUser.avatar_url || defAv;
            document.getElementById('header-avatar').src = avUrl; document.getElementById('drawer-avatar-preview').src = avUrl;
        }

        function previewTheme(t) { if (t === 'light') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); }
        function previewFont(fontName) { document.documentElement.style.setProperty('--font-family', fontName); }

        async function toggleEyeComfort() {
            document.body.classList.toggle('eye-comfort');
            const newVal = document.body.classList.contains('eye-comfort');
            currentUser.eye_comfort = newVal;
            sessionStorage.setItem('sla_user', JSON.stringify(currentUser));
            try { await patchSupabase('usuarios', `id=eq.${currentUser.id}`, { eye_comfort: newVal }); }
            catch(e) { console.error('Erro ao salvar conforto ocular:', e); }
        }

        function handleAvatarSelect(event) { const f = event.target.files[0]; if(f) { avatarFile = f; document.getElementById('avatarFileDisplay').innerHTML = `<i class="fas fa-check-circle" style="color:var(--success)"></i> S3 Ready`; const r = new FileReader(); r.onload = (e) => document.getElementById('drawer-avatar-preview').src = e.target.result; r.readAsDataURL(f); } }

        async function savePreferences() {
            const btn = document.getElementById('btnSavePrefs');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Salvando...';
            btn.disabled = true;

            const userPayload = {
                tema: document.getElementById('pref-theme').value,
                fonte: document.getElementById('pref-font').value,
                emoji_vitoria: document.getElementById('pref-emoji').value || null
            };

            if (avatarFile) {
                try {
                    // 1. Limpa e formata o nome do usuário para usar no arquivo
                    const safeUsername = (currentUser.usuario || 'usuario').replace(/[^a-zA-Z0-9]/g, '_').toLowerCase();

                    // 2. Busca na tabela de usuários o registro atual para ver se já existe uma foto/versão anterior
                    const checkRes = await fetch(`${SUPABASE_URL}/usuarios?id=eq.${currentUser.id}&select=avatar_url`, { headers });
                    const checkData = await checkRes.json();

                    let versao = 1;
                    if (checkData && checkData.length > 0 && checkData[0].avatar_url) {
                        const oldUrl = checkData[0].avatar_url;
                        const match = oldUrl.match(/_versao(\d+)\./);
                        if (match && match[1]) versao = parseInt(match[1]) + 1;
                    }

                    // 3. Pega a extensão original do arquivo (jpg, png, etc)
                    const fileExt = avatarFile.name.split('.').pop().toLowerCase() || 'jpg';
                    const fName = `${safeUsername}_versao${versao}.${fileExt}`;

                    // 4. Faz o upload para o S3 com o novo nome inteligente
                    await s3Client.putObject({
                        Bucket: 'pics_recs',
                        Key: fName,
                        Body: avatarFile,
                        ContentType: avatarFile.type || 'image/jpeg'
                    }).promise();

                    userPayload.avatar_url = `https://ueicrehzfrwewgteqxvi.supabase.co/storage/v1/object/public/pics_recs/${fName}`;
                } catch(e) {
                    console.error("ERRO NO UPLOAD DO AVATAR:", e);
                    showToast("Erro no upload da foto: " + e.message, true);
                    btn.innerHTML = '<i class="fas fa-save"></i> Salvar Preferências';
                    btn.disabled = false;
                    return;
                }
            }

            // 5. Grava tema/fonte/emoji (+avatar, se trocado) em uma única chamada na tabela usuarios.
            // ATENÇÃO: se a policy de UPDATE do Supabase (RLS) não liberar o role "anon" para
            // a tabela usuarios, este PATCH volta com array vazio (não é erro HTTP!), e o
            // patchSupabase() abaixo transforma isso num erro de verdade em vez de falhar em silêncio.
            try {
                const updatedRow = await patchSupabase('usuarios', `id=eq.${currentUser.id}`, userPayload);

                currentUser = { ...currentUser, ...updatedRow };
                sessionStorage.setItem('sla_user', JSON.stringify(currentUser));

                // Isso é o que impedia a foto/tema de atualizar no Chat e nos Cards de Desempenho
                const uIdx = allUsers.findIndex(u => u.id === currentUser.id);
                if (uIdx !== -1) allUsers[uIdx] = { ...allUsers[uIdx], ...updatedRow };

                avatarFile = null;
                document.getElementById('avatarFileDisplay').innerHTML = `<i class="fas fa-camera"></i> Trocar Foto (Upload S3)`;
            } catch(e) {
                console.error("ERRO AO SALVAR PREFERÊNCIAS DO USUÁRIO:", e);
                showToast("Erro: " + e.message, true);
                btn.innerHTML = '<i class="fas fa-save"></i> Salvar Preferências';
                btn.disabled = false;
                return;
            }

            // 6. Grava as cores por status via upsert em tbl_user_preferences
            //    (usa o UNIQUE(usuario_id, status_vaga) já existente na tabela para
            //    decidir entre INSERT ou UPDATE automaticamente).
            const colorRows = Object.keys(STATUS_MAP).map(st => ({
                usuario_id: currentUser.id,
                status_vaga: STATUS_MAP[st],
                cor_fundo_hex: document.getElementById(`pref-st-${st}`).value
            }));
            try {
                const upsertRes = await fetch(`${SUPABASE_URL}/tbl_user_preferences?on_conflict=usuario_id,status_vaga`, {
                    method: 'POST',
                    headers: { ...headers, 'Prefer': 'resolution=merge-duplicates,return=representation' },
                    body: JSON.stringify(colorRows)
                });
                if (!upsertRes.ok) {
                    const err = await upsertRes.json().catch(() => null);
                    throw new Error((err && err.message) || 'Falha ao salvar cores (verifique a RLS de tbl_user_preferences).');
                }
            } catch(e) {
                console.error("ERRO AO SALVAR CORES:", e);
                showToast("Preferências salvas, mas as cores por status não foram salvas: " + e.message, true);
                btn.innerHTML = '<i class="fas fa-save"></i> Salvar Preferências';
                btn.disabled = false;
                return;
            }

            await loadPreferences();
            document.getElementById('prefs-drawer').classList.remove('open');
            btn.innerHTML = '<i class="fas fa-save"></i> Salvar Preferências';
            btn.disabled = false;
            showToast("Preferências Salvas!");
            if(mainChart) updateDashboard();

            // Recarrega os modais instantaneamente se eles estiverem abertos, aplicando a foto/cores novas.
            if (document.getElementById('perfModal').classList.contains('active')) renderPerfCards();
            if (document.getElementById('chat-drawer').classList.contains('open')) reloadChat();
        }

        function formatDataBR(isoStr) { if(!isoStr) return '-'; const parts = isoStr.split('-'); if(parts.length!==3) return isoStr; return `${parts[2]}/${parts[1]}/${parts[0]}`; }

        const columnsConfig = [
            { id: 'acoes', label: 'Opções', filterable: true, isAction: true },
            { id: 'status_vaga', label: 'Status', filterable: true, sortable: true },
            { id: 'current_sla', label: 'SLA (Dias)', filterable: false, sortable: true, isNumber: true },
            { id: 'recrutadora_responsavel', label: 'Recrutadora', filterable: true, sortable: true },
            { id: 'data_abertura_vaga', label: 'Abertura', filterable: true, isDate: true, sortable: true },
            { id: 'diretor', label: 'Diretor', filterable: true, sortable: true },
            { id: 'distrital', label: 'Distrital', filterable: true, sortable: true },
            { id: 'coordenador', label: 'Coordenador', filterable: true, sortable: true },
            { id: 'nome_filial_setor', label: 'Filial/Setor', filterable: true, sortable: true },
            { id: 'cargo_vaga_setor', label: 'Cargo', filterable: true, sortable: true },
            { id: 'nome_candidato', label: 'Candidato', filterable: true, sortable: true },
            { id: 'curriculos', label: 'CVs', filterable: true, sortable: true, isNumber: true },
            { id: 'matricula_candidato', label: 'Matrícula', filterable: true, sortable: true },
            { id: 'data_admissao_candidato', label: 'Admissão', filterable: true, isDate: true, sortable: true },
            { id: 'mailto_anexo_url', label: 'Anexo S3', filterable: false } 
        ];

        function buildTableHeaders() {
            const tr = document.createElement('tr');
            const thCheck = document.createElement('th');
            thCheck.style.width = '36px';
            thCheck.innerHTML = `<input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this.checked)">`;
            tr.appendChild(thCheck);
            columnsConfig.forEach(col => {
                const th = document.createElement('th');
                if(col.id === 'acoes') th.style.width = '140px'; 

                const labelHtml = col.sortable
                    ? `<span class="th-label-sortable" onclick="toggleSort('${col.id}')">${col.label}</span>`
                    : `<span>${col.label}</span>`;
                const sortIconHtml = col.sortable
                    ? `<i class="fas fa-sort sort-icon" id="icon-sort-${col.id}" onclick="toggleSort('${col.id}')" title="Ordenar"></i>`
                    : '';
                
                if(col.filterable) {
                    th.innerHTML = `
                        <div class="th-title-flex">${labelHtml}<div style="display:flex; align-items:center; gap:2px;">${sortIconHtml}<i class="fas fa-filter excel-filter-icon" id="icon-filter-${col.id}" onclick="toggleExcelFilter(event, '${col.id}')"></i></div></div>
                        <div class="excel-filter-modal" id="modal-filter-${col.id}" onclick="event.stopPropagation()">
                            <input type="text" class="excel-filter-search" placeholder="Pesquisar..." oninput="searchFilterList('${col.id}', this.value)">
                            <div class="excel-filter-list" id="list-filter-${col.id}"></div>
                            <div style="display:flex; justify-content:space-between; margin-top:10px; border-top:1px solid #cbd5e1; padding-top:10px;">
                                <button class="btn btn-secondary" style="padding:4px 8px; font-size:0.75rem; border-color:#cbd5e1; color:#000;" onclick="applyColFilter('${col.id}')">OK</button>
                                <button class="btn btn-secondary" style="padding:4px 8px; font-size:0.75rem; border-color:#cbd5e1; color:#ef4444;" onclick="clearColFilter('${col.id}')">Limpar</button>
                            </div>
                        </div>
                    `;
                } else if (col.sortable) {
                    th.innerHTML = `<div class="th-title-flex">${labelHtml}${sortIconHtml}</div>`;
                } else { th.innerText = col.label; }
                tr.appendChild(th);
            });
            document.getElementById('table-head').innerHTML = ''; document.getElementById('table-head').appendChild(tr);
            updateSortIcons();
        }

        // --- ORDENAÇÃO DE COLUNAS ---
        let sortColumn = null;
        let sortDirection = 'asc';

        function toggleSort(colId) {
            if (sortColumn === colId) {
                if (sortDirection === 'asc') { sortDirection = 'desc'; }
                else { sortColumn = null; sortDirection = 'asc'; } // terceiro clique remove a ordenação
            } else {
                sortColumn = colId; sortDirection = 'asc';
            }
            updateSortIcons();
            processLocalData(true);
        }

        function updateSortIcons() {
            columnsConfig.forEach(col => {
                const icon = document.getElementById(`icon-sort-${col.id}`);
                if (!icon) return;
                if (sortColumn === col.id) {
                    icon.className = `fas ${sortDirection === 'asc' ? 'fa-sort-up' : 'fa-sort-down'} sort-icon active`;
                } else {
                    icon.className = 'fas fa-sort sort-icon';
                }
            });
        }

        function setTabFilter(tabId) {
            currentTabFilter = tabId;
            ['todas', 'ativas', 'fechadas'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if(t === tabId) { btn.className = 'btn btn-primary'; btn.style.background = ''; btn.style.color = 'white'; } 
                else { btn.className = 'btn'; btn.style.background = 'transparent'; btn.style.color = 'var(--text-muted)'; }
            });
            processLocalData(false);
        }

        // Aplica a aba atual + todos os filtros ativos, exceto o da coluna colExcluir.
        // Usado tanto pra montar a tabela final (colExcluir = null) quanto pra montar
        // as opções de CADA dropdown de filtro (que nunca se auto-restringe, só é
        // restringido pelos OUTROS filtros já aplicados — igual ao Excel/Tabela Dinâmica).
        function getFilteredBase(colExcluir) {
            let baseData = getUserRawData();
            if (currentTabFilter === 'ativas') { baseData = baseData.filter(v => !['Fechada', 'Cancelada', 'Desistência'].includes(v.status_vaga)); }
            else if (currentTabFilter === 'fechadas') { baseData = baseData.filter(v => ['Fechada', 'Cancelada', 'Desistência'].includes(v.status_vaga)); }

            return baseData.filter(v => {
                for (let col in activeFilters) {
                    if (col === 'acoes' || col === colExcluir) continue;
                    const selectedVals = activeFilters[col];
                    let rowVal = v[col]; if (columnsConfig.find(c => c.id === col).isDate) rowVal = formatDataBR(rowVal);
                    if (!selectedVals.includes((rowVal || '-').toString())) return false;
                }
                return true;
            });
        }

        function toggleExcelFilter(e, colId) {
            e.stopPropagation(); const modal = document.getElementById(`modal-filter-${colId}`); const isOpen = modal.classList.contains('open'); document.querySelectorAll('.excel-filter-modal').forEach(m => m.classList.remove('open'));
            if(!isOpen) {
                const list = document.getElementById(`list-filter-${colId}`);
                // Base pra ESTE dropdown: aplica os outros filtros já ativos (não o dele mesmo) —
                // assim, filtrar Coordenador já limita o que aparece pra Diretor, Filial, etc.
                let vals = getFilteredBase(colId).map(v => { if(colId === 'acoes') return 'Ações'; let val = v[colId]; if(columnsConfig.find(c=>c.id===colId).isDate) val = formatDataBR(val); return val || '-'; });
                let uniqueValues = [...new Set(vals)].sort(); let html = '';
                uniqueValues.forEach(val => { const isChecked = activeFilters[colId] && activeFilters[colId].includes(val) ? 'checked' : ''; html += `<label class="excel-filter-label" data-text="${val.toString().toLowerCase()}"><input type="checkbox" value="${val}" ${isChecked}> ${val}</label>`; });
                if(uniqueValues.length===0) html = '<div style="font-size:0.8rem; color:#64748b;">Sem dados com os outros filtros aplicados</div>';
                list.innerHTML = html; modal.classList.add('open');
            }
        }
        function searchFilterList(colId, term) { term = term.toLowerCase(); document.querySelectorAll(`#list-filter-${colId} .excel-filter-label`).forEach(lbl => { lbl.style.display = lbl.getAttribute('data-text').includes(term) ? 'flex' : 'none'; }); }
        function applyColFilter(colId) {
            const checks = document.querySelectorAll(`#list-filter-${colId} input[type="checkbox"]:checked`); const selected = Array.from(checks).map(cb => cb.value);
            if(selected.length > 0) { activeFilters[colId] = selected; document.getElementById(`icon-filter-${colId}`).classList.add('active'); } 
            else { delete activeFilters[colId]; document.getElementById(`icon-filter-${colId}`).classList.remove('active'); }
            document.getElementById(`modal-filter-${colId}`).classList.remove('open'); processLocalData(true);
        }
        function clearColFilter(colId) { delete activeFilters[colId]; document.getElementById(`icon-filter-${colId}`).classList.remove('active'); document.getElementById(`modal-filter-${colId}`).classList.remove('open'); processLocalData(true); }
        function clearAllFilters() { activeFilters = {}; document.querySelectorAll('.excel-filter-icon').forEach(i => i.classList.remove('active')); processLocalData(true); }

        // Painel mobile de escolha de coluna — reaproveita o MESMO toggleExcelFilter()
        // que o desktop usa (mesma lógica de filtro cruzado), só muda como se chega até ele.
        function abrirEscolhaFiltroMobile() {
            const list = document.getElementById('mobileFiltroColunaList');
            list.innerHTML = columnsConfig.filter(c => c.filterable && c.id !== 'acoes').map(c => {
                const ativo = activeFilters[c.id] ? ` <span style="color:var(--primary); font-weight:800;">(${activeFilters[c.id].length})</span>` : '';
                return `<button class="btn btn-secondary" style="justify-content:space-between; padding:14px 16px;" onclick="event.stopPropagation(); document.getElementById('mobileFiltroColunaModal').classList.remove('active'); toggleExcelFilter({stopPropagation:()=>{}}, '${c.id}');">${c.label}${ativo} <i class="fas fa-chevron-right"></i></button>`;
            }).join('');
            document.getElementById('mobileFiltroColunaModal').classList.add('active');
        }

        async function loadVagas(isFirstLoad) {
            try {
                const res = await fetch(`${SUPABASE_URL}/vagas?select=*&limit=10000&order=created_at.desc`, { headers }); const newData = await res.json();
                const today = new Date().toISOString().split('T')[0];
                newData.forEach(v => {
                    v.current_sla = 0;
                    // Se a vaga já foi transferida entre recrutadoras, o SLA conta a partir da
                    // data em que a dona ATUAL a recebeu (data_inicio_sla_atual), não da abertura
                    // original — assim ninguém herda o atraso de quem tinha a vaga antes.
                    const inicioSla = v.data_inicio_sla_atual || v.data_inicio_trabalho;
                    if (inicioSla) {
                        let endDate = today; if (['Fechada', 'Cancelada', 'Desistência'].includes(v.status_vaga) && v.data_fechamento) endDate = v.data_fechamento;
                        let count = 0; let cur = new Date(inicioSla); const end = new Date(endDate);
                        while (cur <= end) { if (cur.getDay() !== 0 && cur.getDay() !== 6) count++; cur.setDate(cur.getDate() + 1); }
                        v.current_sla = count;
                    }
                });
                rawData = newData; processLocalData(!isFirstLoad); processNotifications(isFirstLoad);
            } catch(e) {}
        }

        function processLocalData(silent = false) {
            filteredData = getFilteredBase(null);

            if (sortColumn) {
                const colCfg = columnsConfig.find(c => c.id === sortColumn);
                filteredData.sort((a, b) => {
                    let va = a[sortColumn]; let vb = b[sortColumn];
                    if (colCfg && colCfg.isNumber) { va = Number(va) || 0; vb = Number(vb) || 0; }
                    else if (colCfg && colCfg.isDate) { va = va ? new Date(va).getTime() : 0; vb = vb ? new Date(vb).getTime() : 0; }
                    else { va = (va || '').toString().toLowerCase(); vb = (vb || '').toString().toLowerCase(); }
                    if (va < vb) return sortDirection === 'asc' ? -1 : 1;
                    if (va > vb) return sortDirection === 'asc' ? 1 : -1;
                    return 0;
                });
            }

            document.getElementById('kpi-total').innerText = filteredData.length;
            document.getElementById('kpi-fechadas').innerText = filteredData.filter(v => v.status_vaga === 'Fechada').length;
            document.getElementById('kpi-admissao').innerText = filteredData.filter(v => v.status_vaga === 'Aguardando Admissão').length;
            let sumSla = 0; filteredData.forEach(v => sumSla += (v.current_sla||0));
            document.getElementById('kpi-sla-medio').innerText = filteredData.length > 0 ? (sumSla/filteredData.length).toFixed(1) : "0.0";
            
            renderGrid(silent);
        }

        function getStatusClass(status) { switch(status) { case 'Fechada': return 'st-fechada'; case 'Stand-by': return 'st-standby'; case 'Cancelada': return 'st-cancelada'; case 'Desistência': return 'st-desistencia'; case 'Aguardando Admissão': return 'st-admissao'; default: return 'st-aberta'; } }

        function renderGrid(silent) {
            const tbody = document.getElementById('grid-body'); const scrollPos = silent ? document.querySelector('.table-container').scrollTop : 0;
            let html = '';
            filteredData.forEach(row => {
                let slaColor = 'var(--text-main)';
                if (!['Fechada', 'Cancelada', 'Desistência'].includes(row.status_vaga)) { if (row.current_sla > row.meta_sla) slaColor = 'var(--danger)'; else if (row.current_sla >= (row.meta_sla * 0.8)) slaColor = 'var(--warning)'; else slaColor = 'var(--success)'; }

                html += `
                    <tr id="tr-${row.id}" ondblclick="openVagaCard('${row.id}')" style="cursor:pointer;" title="Duplo clique para abrir Card da Vaga">
                        <td data-label="Selecionar" onclick="event.stopPropagation()"><input type="checkbox" class="rowCheckbox" data-id="${row.id}" ${selectedVagas.has(row.id) ? 'checked' : ''} onchange="toggleSelectRow('${row.id}', this.checked)"></td>
                        <td data-label="Opções" style="display:flex; gap:5px;">
                            <button class="btn btn-secondary" style="padding: 6px 10px; font-size: 0.8rem;" onclick="openVagaCard(event, '${row.id}')" title="Card Visual"><i class="fas fa-id-card"></i></button>
                            <button class="btn btn-primary" style="padding: 6px 10px; font-size: 0.8rem;" onclick="openActionModal(event, '${row.id}')" title="Ações da Vaga"><i class="fas fa-cog"></i></button>
                            <button class="btn btn-secondary" style="padding: 6px 10px; font-size: 0.8rem;" onclick="openChat(event, '${row.id}')" title="Chat"><i class="fas fa-comments"></i></button>
                        </td>
                        <td data-label="Status"><span class="status-badge ${getStatusClass(row.status_vaga)}">${row.status_vaga || 'Aberta'}</span></td>
                        <td data-label="SLA (Dias)" style="font-weight:bold; color: ${slaColor}">${row.current_sla || 0} / ${row.meta_sla || '-'}</td>
                        <td data-label="Recrutadora">${row.recrutadora_responsavel || '-'}</td>
                        <td data-label="Abertura">${formatDataBR(row.data_abertura_vaga || row.data_solicitacao)}</td>
                        <td data-label="Diretor">${row.diretor || '-'}</td>
                        <td data-label="Distrital">${row.distrital || '-'}</td>
                        <td data-label="Coordenador">${row.coordenador || '-'}</td>
                        <td data-label="Filial/Setor">${row.nome_filial_setor || '-'}</td>
                        <td data-label="Cargo">${row.cargo_vaga_setor || '-'}</td>
                        <td data-label="Candidato">${row.nome_candidato || '-'}</td>
                        <td data-label="CVs">
                            <div style="display:flex; align-items:center; justify-content:center; gap:8px;">
                                <button class="btn btn-secondary" style="padding: 2px 6px; font-size: 0.7rem;" onclick="addCV(event, '${row.id}', ${row.curriculos||0}, -1)" title="Remover"><i class="fas fa-minus"></i></button>
                                <span style="font-weight:bold; color:var(--primary); font-size:1rem; min-width: 15px; text-align:center;">${row.curriculos || 0}</span>
                                <button class="btn btn-secondary" style="padding: 2px 6px; font-size: 0.7rem;" onclick="addCV(event, '${row.id}', ${row.curriculos||0}, 1)" title="Adicionar"><i class="fas fa-plus"></i></button>
                            </div>
                        </td>
                        <td data-label="Matrícula">${row.matricula_candidato || '-'}</td>
                        <td data-label="Admissão">${formatDataBR(row.data_admissao_candidato)}</td>
                        <td data-label="Anexo S3">${row.mailto_anexo_url ? `<a href="${row.mailto_anexo_url}" target="_blank" onclick="event.stopPropagation()" class="btn btn-secondary" style="padding:4px 8px; font-size:0.75rem;"><i class="fas fa-paperclip"></i> Ver</a>` : '-'}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
            if(silent) document.querySelector('.table-container').scrollTop = scrollPos;
        }


        // --- SELEÇÃO DE VAGAS NA TABELA ---
        function toggleSelectRow(id, checked) {
            if (checked) selectedVagas.add(id); else selectedVagas.delete(id);
            updateBulkBar();
        }
        function toggleSelectAll(checked) {
            filteredData.forEach(v => { if (checked) selectedVagas.add(v.id); else selectedVagas.delete(v.id); });
            renderGrid(true); updateBulkBar();
        }
        function clearSelection() {
            selectedVagas.clear();
            const selectAll = document.getElementById('selectAllCheckbox'); if (selectAll) selectAll.checked = false;
            renderGrid(true); updateBulkBar();
        }
        function updateBulkBar() {
            const bar = document.getElementById('bulkBar');
            if (selectedVagas.size > 0) { bar.style.display = 'flex'; document.getElementById('bulkCount').innerText = selectedVagas.size; }
            else { bar.style.display = 'none'; }
        }

        // --- PROPRIEDADE E TRANSFERÊNCIA ---

        // Assumir uma vaga sem dono (livre, sem aprovação) — só é possível se a vaga
        // já está visível pra mim (grupo aberto, meu grupo, ou sem grupo nenhum).
        async function assumirVaga(id) {
            const vaga = rawData.find(v => v.id === id);
            if (!vaga) return;
            try {
                await patchSupabase('vagas', `id=eq.${id}`, { recrutadora_responsavel: currentUser.usuario });
                showToast('Vaga atribuída a você!');
                document.getElementById('actionModal').classList.remove('active');
                loadVagas(false);
            } catch(e) { showToast('Erro ao assumir vaga: ' + e.message, true); }
        }

        function preencherSelectUsuarios(selectEl, excluirUsuarioId) {
            selectEl.innerHTML = allUsers
                .filter(u => u.id !== excluirUsuarioId)
                .map(u => `<option value="${u.id}">${u.usuario}</option>`)
                .join('');
        }

        // Abre o modal de transferência. Se targetId for null, é uma transferência em massa
        // (usa a barra de seleção); senão é a transferência de uma única vaga específica.
        let transferSingleVagaId = null;
        function openTransferModal(vagaId) {
            transferSingleVagaId = vagaId;
            const ids = vagaId ? [vagaId] : Array.from(selectedVagas);
            if (ids.length === 0) { showToast('Selecione ao menos uma vaga.', true); return; }
            document.getElementById('actionModal').classList.remove('active');
            preencherSelectUsuarios(document.getElementById('transferAlvoSelect'), currentUser.id);
            document.getElementById('transferMotivo').value = '';
            document.getElementById('transferHint').innerText = isUserAdmin(currentUser)
                ? 'Como administrador, a transferência é feita direto, sem precisar de aprovação.'
                : 'Transferência para alguém do mesmo grupo da vaga é direta. Para fora do grupo, vira uma solicitação para aprovação.';
            document.getElementById('transferModal').classList.add('active');
        }

        async function confirmarTransferencia() {
            const ids = transferSingleVagaId ? [transferSingleVagaId] : Array.from(selectedVagas);
            const alvoId = document.getElementById('transferAlvoSelect').value;
            const alvoUser = allUsers.find(u => u.id === alvoId);
            const motivo = document.getElementById('transferMotivo').value.trim();
            if (!alvoUser) { showToast('Escolha uma recrutadora de destino.', true); return; }

            const btn = document.getElementById('btnConfirmTransfer');
            btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processando...';

            let diretas = 0, solicitadas = 0, erros = 0;
            for (const id of ids) {
                const vaga = rawData.find(v => v.id === id);
                if (!vaga) continue;
                const admin = isUserAdmin(currentUser);
                // Transferência livre: sou admin, OU a vaga tem um grupo definido e tanto eu quanto
                // o alvo somos membros desse grupo.
                const alvoGrupos = getUserGroupNames(alvoUser);
                const mesmoGrupoLivre = !admin && vaga.grupo_atribuido &&
                    getUserGroupNames(currentUser).includes(vaga.grupo_atribuido) &&
                    alvoGrupos.includes(vaga.grupo_atribuido);

                try {
                    if (admin || mesmoGrupoLivre) {
                        await patchSupabase('vagas', `id=eq.${id}`, { recrutadora_responsavel: alvoUser.usuario });
                        diretas++;
                    } else {
                        const res = await fetch(`${SUPABASE_URL}/solicitacoes_vaga`, {
                            method: 'POST', headers,
                            body: JSON.stringify({ vaga_id: id, tipo: 'transferencia', solicitante_id: currentUser.id, alvo_usuario_id: alvoId, motivo: motivo || null })
                        });
                        if (!res.ok) throw new Error('Falha ao criar solicitação.');
                        solicitadas++;
                    }
                } catch(e) { console.error(e); erros++; }
            }

            btn.disabled = false; btn.innerHTML = '<i class="fas fa-paper-plane"></i> Confirmar';
            document.getElementById('transferModal').classList.remove('active');
            clearSelection();
            let msg = [];
            if (diretas > 0) msg.push(`${diretas} transferida(s) direto`);
            if (solicitadas > 0) msg.push(`${solicitadas} enviada(s) para aprovação`);
            if (erros > 0) msg.push(`${erros} com erro`);
            showToast(msg.join(' · ') || 'Nada foi processado.', erros > 0);
            loadVagas(false);
        }

        // Ação em massa: exclusão ou propriedade (sempre viram solicitação, exceto se eu for admin)
        async function bulkAction(tipo) {
            const ids = Array.from(selectedVagas);
            if (ids.length === 0) { showToast('Selecione ao menos uma vaga.', true); return; }
            const admin = isUserAdmin(currentUser);
            let motivo = null;
            if (!admin) {
                motivo = prompt(tipo === 'exclusao' ? 'Motivo da exclusão:' : 'Motivo do pedido de propriedade:');
                if (motivo === null) return; // cancelou
            } else if (tipo === 'exclusao') {
                if (!confirm(`Confirma a exclusão de ${ids.length} vaga(s)? Essa ação não pode ser desfeita.`)) return;
            }

            let ok = 0, erros = 0;
            for (const id of ids) {
                try {
                    if (admin) {
                        if (tipo === 'exclusao') {
                            const res = await fetch(`${SUPABASE_URL}/vagas?id=eq.${id}`, { method: 'DELETE', headers });
                            if (!res.ok) throw new Error('Falha ao excluir.');
                        } else {
                            await patchSupabase('vagas', `id=eq.${id}`, { recrutadora_responsavel: currentUser.usuario });
                        }
                    } else {
                        const res = await fetch(`${SUPABASE_URL}/solicitacoes_vaga`, {
                            method: 'POST', headers,
                            body: JSON.stringify({ vaga_id: id, tipo: tipo, solicitante_id: currentUser.id, motivo: motivo || null })
                        });
                        if (!res.ok) throw new Error('Falha ao criar solicitação.');
                    }
                    ok++;
                } catch(e) { console.error(e); erros++; }
            }
            clearSelection();
            showToast(`${ok} processada(s)${erros > 0 ? `, ${erros} com erro` : ''}${!admin ? ' — aguardando aprovação' : ''}.`, erros > 0);
            loadVagas(false);
        }

        // --- TRANSFERÊNCIA POR PERÍODO (FÉRIAS) ---
        function openPeriodoModal() {
            const origemSelect = document.getElementById('periodoOrigemSelect');
            const destinoSelect = document.getElementById('periodoDestinoSelect');
            const admin = isUserAdmin(currentUser);
            if (admin) {
                origemSelect.innerHTML = allUsers.map(u => `<option value="${u.id}">${u.usuario}</option>`).join('');
                origemSelect.disabled = false;
            } else {
                origemSelect.innerHTML = `<option value="${currentUser.id}">${currentUser.usuario} (você)</option>`;
                origemSelect.disabled = true;
            }
            preencherSelectUsuarios(destinoSelect, origemSelect.value);
            document.getElementById('periodoInicio').value = '';
            document.getElementById('periodoFim').value = '';
            document.getElementById('periodoMotivo').value = '';
            document.getElementById('periodoModal').classList.add('active');
        }

        async function confirmarPeriodo() {
            const origemId = document.getElementById('periodoOrigemSelect').value;
            const destinoId = document.getElementById('periodoDestinoSelect').value;
            const inicio = document.getElementById('periodoInicio').value;
            const fim = document.getElementById('periodoFim').value;
            const motivo = document.getElementById('periodoMotivo').value.trim();
            if (!origemId || !destinoId || origemId === destinoId) { showToast('Escolha origem e destino diferentes.', true); return; }
            if (!inicio || !fim) { showToast('Preencha o período.', true); return; }

            const admin = isUserAdmin(currentUser);
            const payload = {
                recrutadora_origem_id: origemId, recrutadora_destino_id: destinoId,
                data_inicio: inicio, data_fim: fim, motivo: motivo || null,
                solicitante_id: currentUser.id
            };

            try {
                if (admin) {
                    payload.status = 'Aprovada'; payload.respondido_por = currentUser.id; payload.respondido_em = new Date().toISOString();
                    const res = await fetch(`${SUPABASE_URL}/transferencias_periodo`, { method: 'POST', headers, body: JSON.stringify(payload) });
                    if (!res.ok) throw new Error('Falha ao registrar.');
                    await aplicarTransferenciaPeriodo(origemId, destinoId);
                    showToast('Transferência por período aplicada!');
                } else {
                    const res = await fetch(`${SUPABASE_URL}/transferencias_periodo`, { method: 'POST', headers, body: JSON.stringify(payload) });
                    if (!res.ok) throw new Error('Falha ao enviar solicitação.');
                    showToast('Solicitação enviada — aguardando aprovação de um administrador.');
                }
                document.getElementById('periodoModal').classList.remove('active');
                loadVagas(false);
            } catch(e) { showToast('Erro: ' + e.message, true); }
        }

        async function aplicarTransferenciaPeriodo(origemId, destinoId) {
            const origemUser = allUsers.find(u => u.id === origemId);
            const destinoUser = allUsers.find(u => u.id === destinoId);
            if (!origemUser || !destinoUser) return;
            const res = await fetch(`${SUPABASE_URL}/vagas?recrutadora_responsavel=eq.${encodeURIComponent(origemUser.usuario)}`, {
                method: 'PATCH', headers, body: JSON.stringify({ recrutadora_responsavel: destinoUser.usuario })
            });
            if (!res.ok) throw new Error('Falha ao transferir as vagas do período.');
        }

        // --- CENTRAL DE SOLICITAÇÕES (ADMINISTRADOR) ---
        async function refreshSolicBadge() {
            try {
                const [r1, r2] = await Promise.all([
                    fetch(`${SUPABASE_URL}/solicitacoes_vaga?status=eq.Pendente&select=id`, { headers }),
                    fetch(`${SUPABASE_URL}/transferencias_periodo?status=eq.Pendente&select=id`, { headers })
                ]);
                const d1 = await r1.json(); const d2 = await r2.json();
                const total = (Array.isArray(d1) ? d1.length : 0) + (Array.isArray(d2) ? d2.length : 0);
                const badge = document.getElementById('solicBadge');
                if (total > 0) { badge.style.display = 'inline-block'; badge.innerText = total; } else { badge.style.display = 'none'; }
            } catch(e) { console.error('Erro ao checar solicitações pendentes', e); }
        }

        async function openSolicitacoesModal() {
            document.getElementById('solicitacoesModal').classList.add('active');
            const list = document.getElementById('solicitacoesList');
            list.innerHTML = '<p style="color:var(--text-muted); text-align:center;">Carregando...</p>';
            try {
                const [r1, r2] = await Promise.all([
                    fetch(`${SUPABASE_URL}/solicitacoes_vaga?status=eq.Pendente&order=created_at.desc`, { headers }),
                    fetch(`${SUPABASE_URL}/transferencias_periodo?status=eq.Pendente&order=created_at.desc`, { headers })
                ]);
                const solicitacoes = await r1.json();
                const periodos = await r2.json();
                let html = '';

                const tipoLabel = { exclusao: 'Solicitação de Exclusão', propriedade: 'Solicitação de Propriedade', transferencia: 'Solicitação de Transferência' };
                const tipoIcon = { exclusao: 'fa-trash', propriedade: 'fa-hand-paper', transferencia: 'fa-exchange-alt' };

                (Array.isArray(solicitacoes) ? solicitacoes : []).forEach(s => {
                    const vaga = rawData.find(v => v.id === s.vaga_id);
                    const solicitante = allUsers.find(u => u.id === s.solicitante_id);
                    const alvo = allUsers.find(u => u.id === s.alvo_usuario_id);
                    html += `
                    <div class="kpi-card" style="padding:16px;">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;">
                            <div>
                                <div style="font-weight:800; color:var(--text-main);"><i class="fas ${tipoIcon[s.tipo]}"></i> ${tipoLabel[s.tipo]}</div>
                                <div style="font-size:0.85rem; color:var(--text-muted); margin-top:4px;">Vaga: ${vaga ? vaga.cargo_vaga_setor + ' — ' + vaga.nome_filial_setor : '(vaga não encontrada)'}</div>
                                <div style="font-size:0.85rem; color:var(--text-muted);">Solicitado por: ${solicitante ? solicitante.usuario : '-'}${alvo ? ' → para ' + alvo.usuario : ''}</div>
                                ${s.motivo ? `<div style="font-size:0.85rem; color:var(--text-main); margin-top:6px; font-style:italic;">"${s.motivo}"</div>` : ''}
                            </div>
                        </div>
                        <div style="display:flex; gap:8px;">
                            <button class="btn btn-primary" style="padding:8px 14px; font-size:0.8rem;" onclick="responderSolicitacao('${s.id}', true)"><i class="fas fa-check"></i> Aprovar</button>
                            <button class="btn btn-danger" style="padding:8px 14px; font-size:0.8rem;" onclick="responderSolicitacao('${s.id}', false)"><i class="fas fa-times"></i> Rejeitar</button>
                        </div>
                    </div>`;
                });

                (Array.isArray(periodos) ? periodos : []).forEach(p => {
                    const origem = allUsers.find(u => u.id === p.recrutadora_origem_id);
                    const destino = allUsers.find(u => u.id === p.recrutadora_destino_id);
                    html += `
                    <div class="kpi-card" style="padding:16px; border-left-color: var(--warning);">
                        <div style="font-weight:800; color:var(--text-main);"><i class="fas fa-plane-departure"></i> Transferência por Período</div>
                        <div style="font-size:0.85rem; color:var(--text-muted); margin-top:4px;">${origem ? origem.usuario : '-'} → ${destino ? destino.usuario : '-'}</div>
                        <div style="font-size:0.85rem; color:var(--text-muted);">${formatDataBR(p.data_inicio)} até ${formatDataBR(p.data_fim)}</div>
                        ${p.motivo ? `<div style="font-size:0.85rem; color:var(--text-main); margin-top:6px; font-style:italic;">"${p.motivo}"</div>` : ''}
                        <div style="display:flex; gap:8px; margin-top:10px;">
                            <button class="btn btn-primary" style="padding:8px 14px; font-size:0.8rem;" onclick="responderPeriodo('${p.id}', true)"><i class="fas fa-check"></i> Aprovar</button>
                            <button class="btn btn-danger" style="padding:8px 14px; font-size:0.8rem;" onclick="responderPeriodo('${p.id}', false)"><i class="fas fa-times"></i> Rejeitar</button>
                        </div>
                    </div>`;
                });

                list.innerHTML = html || '<p style="color:var(--text-muted); text-align:center;">Nenhuma solicitação pendente.</p>';
            } catch(e) { list.innerHTML = '<p style="color:var(--danger); text-align:center;">Erro ao carregar solicitações.</p>'; }
        }

        async function responderSolicitacao(id, aprovar) {
            try {
                const res = await fetch(`${SUPABASE_URL}/solicitacoes_vaga?id=eq.${id}&select=*`, { headers });
                const rows = await res.json();
                const s = rows[0];
                if (!s) return;

                if (aprovar) {
                    if (s.tipo === 'exclusao') {
                        await fetch(`${SUPABASE_URL}/vagas?id=eq.${s.vaga_id}`, { method: 'DELETE', headers });
                    } else if (s.tipo === 'propriedade') {
                        const solicitante = allUsers.find(u => u.id === s.solicitante_id);
                        if (solicitante) await patchSupabase('vagas', `id=eq.${s.vaga_id}`, { recrutadora_responsavel: solicitante.usuario });
                    } else if (s.tipo === 'transferencia') {
                        const alvo = allUsers.find(u => u.id === s.alvo_usuario_id);
                        if (alvo) await patchSupabase('vagas', `id=eq.${s.vaga_id}`, { recrutadora_responsavel: alvo.usuario });
                    }
                }
                await patchSupabase('solicitacoes_vaga', `id=eq.${id}`, { status: aprovar ? 'Aprovada' : 'Rejeitada', respondido_por: currentUser.id, respondido_em: new Date().toISOString() });
                showToast(aprovar ? 'Solicitação aprovada!' : 'Solicitação rejeitada.');
                openSolicitacoesModal(); refreshSolicBadge(); loadVagas(false);
            } catch(e) { showToast('Erro: ' + e.message, true); }
        }

        async function responderPeriodo(id, aprovar) {
            try {
                const res = await fetch(`${SUPABASE_URL}/transferencias_periodo?id=eq.${id}&select=*`, { headers });
                const rows = await res.json();
                const p = rows[0];
                if (!p) return;
                if (aprovar) await aplicarTransferenciaPeriodo(p.recrutadora_origem_id, p.recrutadora_destino_id);
                await patchSupabase('transferencias_periodo', `id=eq.${id}`, { status: aprovar ? 'Aprovada' : 'Rejeitada', respondido_por: currentUser.id, respondido_em: new Date().toISOString() });
                showToast(aprovar ? 'Transferência aplicada!' : 'Solicitação rejeitada.');
                openSolicitacoesModal(); refreshSolicBadge(); loadVagas(false);
            } catch(e) { showToast('Erro: ' + e.message, true); }
        }

        // --- GESTÃO DE GRUPOS DE RECRUTAMENTO (ADMINISTRADOR) ---
        async function openGruposModal() {
            await loadGrupos();
            renderGruposList();
            const sel = document.getElementById('grupoUsuarioSelect');
            sel.innerHTML = allUsers.map(u => `<option value="${u.id}">${u.usuario}</option>`).join('');
            carregarGruposDoUsuario();
            document.getElementById('gruposModal').classList.add('active');
        }

        function renderGruposList() {
            const list = document.getElementById('gruposList');
            list.innerHTML = allGroups.map(g => `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 14px; background:var(--bg-base); border:1px solid var(--border-color); border-radius:10px;">
                    <span style="color:var(--text-main); font-weight:600;">${g.nome} ${g.is_admin ? '<span style="color:var(--danger); font-size:0.7rem; font-weight:800;">ADMIN</span>' : ''}</span>
                    ${g.somenteLeitura ? '<span style="font-size:0.7rem; color:var(--text-muted);"><i class="fas fa-store"></i> vem da filial</span>' : ''}
                </div>`).join('') || '<p style="color:var(--text-muted); font-size:0.85rem;">Nenhum grupo encontrado ainda — preencha a coluna grupos_recrutamento na tabela_heart_fact.</p>';
        }

        function carregarGruposDoUsuario() {
            const userId = document.getElementById('grupoUsuarioSelect').value;
            const user = allUsers.find(u => u.id === userId);
            const meusGrupos = getUserGroupNames(user);
            const box = document.getElementById('grupoUsuarioCheckboxes');
            box.innerHTML = allGroups.map(g => `
                <label style="display:flex; align-items:center; gap:6px; background:var(--bg-base); border:1px solid var(--border-color); padding:6px 12px; border-radius:20px; cursor:pointer; font-size:0.85rem; color:var(--text-main);">
                    <input type="checkbox" value="${g.nome}" ${meusGrupos.includes(g.nome) ? 'checked' : ''}> ${g.nome}
                </label>`).join('');
        }

        async function salvarGruposDoUsuario() {
            const userId = document.getElementById('grupoUsuarioSelect').value;
            const checked = Array.from(document.querySelectorAll('#grupoUsuarioCheckboxes input:checked')).map(c => c.value);
            try {
                const updated = await patchSupabase('usuarios', `id=eq.${userId}`, { grupos_recrutamento: checked.join(';') });
                const idx = allUsers.findIndex(u => u.id === userId);
                if (idx !== -1) allUsers[idx] = { ...allUsers[idx], ...updated };
                if (currentUser.id === userId) { currentUser = { ...currentUser, ...updated }; sessionStorage.setItem('sla_user', JSON.stringify(currentUser)); atualizarVisibilidadeAdmin(); }
                showToast('Grupos salvos!');
            } catch(e) { showToast('Erro: ' + e.message, true); }
        }

        async function addCV(e, id, currentCount, delta) {
            e.stopPropagation();
            let newVal = currentCount + delta; if(newVal < 0) newVal = 0;
            const target = rawData.find(v => v.id == id); if(target) target.curriculos = newVal;
            processLocalData(true); 
            try { await patchSupabase('vagas', `id=eq.${id}`, { curriculos: newVal }); } 
            catch(err) { if(target) target.curriculos = currentCount; processLocalData(true); showToast("Erro ao salvar currículo: " + err.message, true); }
        }

        function vagaBannerClass(status) {
            switch(status) { case 'Fechada': return 'vc-banner-fechada'; case 'Stand-by': return 'vc-banner-standby'; case 'Cancelada': return 'vc-banner-cancelada'; case 'Desistência': return 'vc-banner-desistencia'; case 'Aguardando Admissão': return 'vc-banner-admissao'; default: return 'vc-banner-aberta'; }
        }

        function openVagaCard(e_or_id, id_param) {
            if(typeof e_or_id === 'object') e_or_id.stopPropagation(); 
            const id = id_param || e_or_id; selectedVaga = rawData.find(x => x.id == id);
            const v = selectedVaga;
            const status = v.status_vaga || 'Aberta';
            const isFinalizada = ['Fechada', 'Cancelada', 'Desistência'].includes(status);

            // Banner colorido conforme o status
            const banner = document.getElementById('vcBanner');
            banner.className = 'vc-banner ' + vagaBannerClass(status);
            document.getElementById('vcBadge').innerText = status;
            document.getElementById('vcCargo').innerText = v.cargo_vaga_setor || '-';
            document.getElementById('vcFilial').innerText = v.nome_filial_setor || '-';

            // Anel de progresso do SLA
            const meta = v.meta_sla || 0;
            const atual = v.current_sla || 0;
            const pct = meta > 0 ? Math.min(atual / meta, 1) : 0;
            const circunf = 150.8; // 2 * PI * 24
            document.getElementById('vcSlaRingFg').setAttribute('stroke-dashoffset', (circunf * (1 - pct)).toFixed(1));
            document.getElementById('vcSlaRingText').innerText = `${atual}d`;
            document.getElementById('vcSlaText').innerText = `${atual} / ${meta || '-'} dias úteis`;
            document.getElementById('vcSlaWrap').style.display = isFinalizada ? 'none' : 'flex';

            // Chips de informação
            const chip = (label, value, icon, full) => `
                <div class="vc-chip ${full ? 'vc-chip-full' : ''}">
                    <div class="vc-chip-label"><i class="fas ${icon}"></i> ${label}</div>
                    <div class="vc-chip-value">${value || '-'}</div>
                </div>`;
            document.getElementById('vcDetails').innerHTML =
                chip('Recrutadora', v.recrutadora_responsavel, 'fa-user-tie') +
                chip('Data Abertura', formatDataBR(v.data_abertura_vaga || v.data_solicitacao), 'fa-calendar-day') +
                chip('Solicitante', v.nome_solicitante, 'fa-user') +
                chip('Diretor', v.diretor, 'fa-building') +
                chip('Coordenador', v.coordenador, 'fa-users') +
                chip('Currículos Recebidos', v.curriculos || 0, 'fa-file-alt');

            // Box do candidato (só aparece se já tiver candidato vinculado)
            const candBox = document.getElementById('vcCandidatoBox');
            if (v.nome_candidato) {
                candBox.style.display = 'flex';
                document.getElementById('vcCandidatoAvatar').innerText = v.nome_candidato.substring(0, 2).toUpperCase();
                document.getElementById('vcCandidatoNome').innerText = v.nome_candidato;
                document.getElementById('vcCandidatoMatricula').innerText = v.matricula_candidato ? `Matrícula: ${v.matricula_candidato}` : 'Sem matrícula ainda';
            } else {
                candBox.style.display = 'none';
            }

            // Face expandida: todas as informações extras coletadas no formulário
            const chipIf = (label, value, icon, full) => value ? chip(label, value, icon, full) : '';
            let entrevistadorInfo = v.responsavel_entrevista || '';
            if (v.responsavel_entrevista === 'Outro responsavel' && v.entrevistador_nome) entrevistadorInfo = v.entrevistador_nome;
            let divulgacaoInfo = v.vaga_divulgada || '';
            if (v.vaga_divulgada === 'Sim' && v.onde_divulgada) divulgacaoInfo = v.onde_divulgada;

            document.getElementById('vcExpandedDetails').innerHTML =
                chipIf('Motivo da Vaga', v.motivo_vaga, 'fa-circle-question', true) +
                chipIf('Desde quando é necessária', v.data_necessidade_desde ? formatDataBR(v.data_necessidade_desde) : null, 'fa-calendar-day') +
                chipIf('Data Prevista de Abertura (Loja Nova)', v.data_prevista_abertura_loja ? formatDataBR(v.data_prevista_abertura_loja) : null, 'fa-store') +
                chipIf('Turno', v.turno_trabalho, 'fa-sun') +
                chipIf('Horário', v.horario_trabalho_detalhe, 'fa-clock') +
                chipIf('Já Divulgada?', divulgacaoInfo, 'fa-bullhorn') +
                chipIf('Validada com o GR?', v.validada_gr, 'fa-check-double') +
                chipIf('Quem Entrevista', entrevistadorInfo, 'fa-user-group') +
                chipIf('Encaminhar Candidatos Para', v.encaminhar_candidatos_para, 'fa-paper-plane', true) +
                chipIf('Data de Admissão', v.data_admissao_candidato ? formatDataBR(v.data_admissao_candidato) : null, 'fa-id-badge') +
                chipIf('Data de Fechamento', v.data_fechamento ? formatDataBR(v.data_fechamento) : null, 'fa-flag-checkered') +
                chipIf('Justificativa do Status', v.justificativa_status, 'fa-note-sticky', true)
                || '<p style="color:var(--text-muted); font-size:0.85rem;">Sem informações adicionais preenchidas.</p>';

            vcExpanded = false;
            document.getElementById('vcExpandedSection').style.display = 'none';
            document.getElementById('vcExpandBtn').innerHTML = '<i class="fas fa-expand"></i>';

            // Botão de anexo — só aparece quando a vaga está fechada e tem anexo salvo
            const anexoWrap = document.getElementById('vcAnexoWrap');
            if (status === 'Fechada' && v.mailto_anexo_url) {
                anexoWrap.style.display = 'block';
                anexoWrap.innerHTML = `<a href="${v.mailto_anexo_url}" target="_blank" class="btn btn-secondary" style="width:100%; padding:12px;"><i class="fas fa-paperclip"></i> Acessar Anexo</a>`;
            } else {
                anexoWrap.style.display = 'none';
                anexoWrap.innerHTML = '';
            }

            renderVcActionButtons(status);
            carregarHistoricoTransferencias(v.id);
            document.getElementById('vagaCardModal').classList.add('active');
        }

        let vcExpanded = false;
        function toggleVcExpand() {
            vcExpanded = !vcExpanded;
            document.getElementById('vcExpandedSection').style.display = vcExpanded ? 'block' : 'none';
            document.getElementById('vcExpandBtn').innerHTML = vcExpanded ? '<i class="fas fa-compress"></i>' : '<i class="fas fa-expand"></i>';
        }

        async function carregarHistoricoTransferencias(vagaId) {
            const wrap = document.getElementById('vcHistoricoWrap');
            const list = document.getElementById('vcHistoricoList');
            wrap.style.display = 'none';
            try {
                const res = await fetch(`${SUPABASE_URL}/historico_transferencias_vaga?vaga_id=eq.${vagaId}&order=data_transferencia.desc`, { headers });
                const rows = await res.json();
                if (!Array.isArray(rows) || rows.length === 0) return;
                list.innerHTML = rows.map(r => `
                    <div style="font-size:0.78rem; color:var(--text-muted); background:var(--bg-base); border:1px solid var(--border-color); border-radius:8px; padding:8px 10px;">
                        <b style="color:var(--text-main);">${r.recrutadora_anterior}</b> → <b style="color:var(--text-main);">${r.recrutadora_nova}</b>
                        <span style="display:block; margin-top:2px;">SLA acumulado até a transferência: ${r.sla_acumulado_anterior}d · ${formatDataBR(r.data_transferencia.split('T')[0])}</span>
                    </div>`).join('');
                wrap.style.display = 'block';
            } catch(e) { console.error('Erro ao carregar histórico de transferências', e); }
        }

        // Renderiza os mesmos botões de ação de status usados no modal de Ações (openActionModal),
        // mas aqui dentro do card — clicar neles abre o modal de Ações já na etapa certa.
        function renderVcActionButtons(status) {
            const c = document.getElementById('vcActionButtons');
            c.innerHTML = '';
            if (status === 'Aberta' || !status) {
                c.innerHTML += `<button class="btn btn-primary" style="padding:14px;" onclick="handoffCardAction('FECHAR')"><i class="fas fa-check-circle"></i> Fechar Vaga / Add Admissão</button>`;
                c.innerHTML += `<button class="btn btn-warning" style="padding:14px;" onclick="handoffCardAction('STANDBY_IN')"><i class="fas fa-pause"></i> Iniciar Stand-by</button>`;
                c.innerHTML += `<button class="btn btn-danger" style="padding:14px;" onclick="handoffCardAction('CANCELAR')"><i class="fas fa-times-circle"></i> Cancelar Vaga</button>`;
            } else if (status === 'Stand-by') {
                c.innerHTML += `<button class="btn btn-primary" style="padding:14px;" onclick="handoffCardQuickStatus('Aberta')"><i class="fas fa-play"></i> Encerrar Stand-by</button>`;
                c.innerHTML += `<button class="btn btn-danger" style="padding:14px;" onclick="handoffCardAction('CANCELAR')"><i class="fas fa-times-circle"></i> Cancelar Vaga</button>`;
            } else if (status === 'Cancelada') {
                c.innerHTML += `<button class="btn btn-primary" style="padding:14px;" onclick="handoffCardQuickStatus('Aberta')"><i class="fas fa-undo"></i> Reverter Cancelamento</button>`;
            } else if (status === 'Aguardando Admissão') {
                c.innerHTML += `<button class="btn btn-primary" style="padding:14px;" onclick="handoffCardAction('CONCLUIR_ADM')"><i class="fas fa-check-double"></i> Concluir Fechamento</button>`;
                c.innerHTML += `<button class="btn btn-warning" style="padding:14px;" onclick="handoffCardAction('DESISTENCIA')"><i class="fas fa-user-times"></i> Registrar Desistência</button>`;
                c.innerHTML += `<button class="btn btn-danger" style="padding:14px;" onclick="handoffCardAction('CANCELAR')"><i class="fas fa-times-circle"></i> Cancelar Vaga</button>`;
            } else {
                c.innerHTML = `<div style="text-align:center; padding: 16px; background:rgba(0,0,0,0.02); border-radius:12px; color:var(--text-main);"><i class="fas fa-lock" style="color:var(--text-muted);"></i> Vaga finalizada (${status}).</div>`;
            }
        }

        // Fecha o card e abre o formulário de ação já pronto (Fechar/Standby/Cancelar/etc.)
        function handoffCardAction(actionType) {
            const id = selectedVaga.id;
            document.getElementById('vagaCardModal').classList.remove('active');
            openActionModal(null, id);
            setupActionForm(actionType);
        }
        // Idem, mas para ações diretas de 1 clique (sem formulário) como Encerrar Stand-by / Reverter Cancelamento
        function handoffCardQuickStatus(newStatus) {
            document.getElementById('vagaCardModal').classList.remove('active');
            executeQuickStatus(newStatus);
        }

        async function processNotifications(isFirstLoad) {
            if (!currentUser) return;

            // 1. Carrega as notificações deste usuário já salvas no banco
            try {
                const res = await fetch(`${SUPABASE_URL}/tbl_notifications?usuario_destino_id=eq.${currentUser.id}&order=created_at.desc&limit=200`, { headers });
                const dbRows = await res.json();
                notifsHistory = Array.isArray(dbRows) ? dbRows : [];
            } catch(e) { console.error('Erro ao carregar notificações', e); }

            // ref_id identifica de forma única o evento de origem (id da vaga ou da mensagem de chat)
            // e evita notificar a mesma coisa duas vezes.
            const knownRefs = new Set(notifsHistory.map(n => n.ref_id).filter(Boolean));
            const myData = getUserRawData();
            const visibleIds = myData.map(v => v.id);
            const newRows = [];

            // 2. Notificação de Vaga Atribuível/Aberta
            myData.forEach(v => {
                if (v.status_vaga === 'Aberta' && !knownRefs.has(v.id)) {
                    newRows.push({
                        usuario_destino_id: currentUser.id, vaga_id: v.id, ref_id: v.id,
                        tipo_notificacao: 'vaga_aberta', mensagem: `Nova vaga visível: ${v.cargo_vaga_setor}`, lida: false
                    });
                    knownRefs.add(v.id);
                }
            });

            // 3. Notificação de Chat Ativo
            if (visibleIds.length > 0) {
                try {
                    const chatRes = await fetch(`${SUPABASE_URL}/chat_vagas?order=created_at.desc&limit=50`, {headers});
                    const recentChats = await chatRes.json();
                    recentChats.forEach(c => {
                        if (c.usuario !== currentUser.usuario && visibleIds.includes(c.id_vaga) && !knownRefs.has(c.id)) {
                            const vaga = myData.find(v => v.id === c.id_vaga);
                            newRows.push({
                                usuario_destino_id: currentUser.id, vaga_id: c.id_vaga, ref_id: c.id,
                                tipo_notificacao: 'chat', mensagem: `💬 Nova mensagem de ${c.usuario} (Vaga: ${vaga?.cargo_vaga_setor || '-'})`, lida: false
                            });
                            knownRefs.add(c.id);
                        }
                    });
                } catch(e) { console.error("Erro no chat sync"); }
            }

            // 4. Grava as notificações novas no banco (e já injeta na lista local)
            if (newRows.length > 0) {
                try {
                    const insertRes = await fetch(`${SUPABASE_URL}/tbl_notifications`, { method: 'POST', headers, body: JSON.stringify(newRows) });
                    const inserted = await insertRes.json().catch(() => []);
                    if (Array.isArray(inserted) && inserted.length > 0) notifsHistory = [...inserted, ...notifsHistory];
                } catch(e) { console.error('Erro ao gravar notificações novas', e); }
            }

            renderNotifs();
        }

        function renderNotifs() {
            const badge = document.getElementById('notifBadge'); const list = document.getElementById('notifList'); const unreadCount = notifsHistory.filter(n => !n.lida).length;
            if(unreadCount > 0) { badge.style.display = 'block'; badge.innerText = unreadCount; } else { badge.style.display = 'none'; }
            list.innerHTML = '';
            if(notifsHistory.length === 0) list.innerHTML = '<div class="notif-item" style="justify-content:center;">Sem histórico.</div>';
            notifsHistory.forEach((n) => { list.innerHTML += `<div class="notif-item ${n.lida?'':'unread'}" onclick="clickNotif('${n.id}', '${n.vaga_id}')"><i class="${n.tipo_notificacao==='chat'?'fas fa-comments':'fas fa-briefcase'}" style="color:var(--primary);"></i> ${n.mensagem}</div>`; });
        }
        function toggleNotifications() { document.getElementById('notifDropdown').classList.toggle('active'); }

        async function clickNotif(notifId, vagaId) {
            const notif = notifsHistory.find(n => n.id === notifId);
            const isChat = notif && notif.tipo_notificacao === 'chat';
            if (notif) notif.lida = true;
            renderNotifs(); document.getElementById('notifDropdown').classList.remove('active'); clearAllFilters(); setTabFilter('todas');
            try { await patchSupabase('tbl_notifications', `id=eq.${notifId}`, { lida: true }); }
            catch(e) { console.error('Erro ao marcar notificação como lida', e); }
            setTimeout(() => {
                const tr = document.getElementById(`tr-${vagaId}`);
                if(tr) { tr.scrollIntoView({behavior: 'smooth', block: 'center'}); tr.style.animation = 'highlightRow 2s'; }
                if (isChat) openChat(null, vagaId);
            }, 300);
        }

        async function clearNotifHistory() {
            const ids = notifsHistory.map(n => n.id);
            notifsHistory = [];
            renderNotifs();
            if (ids.length === 0) return;
            try { await fetch(`${SUPABASE_URL}/tbl_notifications?id=in.(${ids.join(',')})`, { method: 'DELETE', headers }); }
            catch(e) { console.error('Erro ao limpar notificações no banco', e); }
        }

        // Chat
        async function openChat(e, id) {
            if(e) e.stopPropagation();
            selectedVaga = rawData.find(v => v.id == id); document.getElementById('chat-drawer').classList.add('open');
            document.getElementById('chat-title-header').innerHTML = `<i class="fas fa-comments"></i> Chat: ${selectedVaga.cargo_vaga_setor}`; reloadChat();
        }

        async function reloadChat() {
            const cont = document.getElementById('chat-messages-container');
            try {
                const res = await fetch(`${SUPABASE_URL}/chat_vagas?id_vaga=eq.${selectedVaga.id}&order=created_at.asc`, { headers }); const msgs = await res.json(); cont.innerHTML = '';
                if(msgs.length === 0) cont.innerHTML = '<p style="text-align:center; color:var(--text-muted); margin-top:20px;">Nenhuma mensagem.</p>';
                msgs.forEach(m => {
                    const isMe = m.usuario === currentUser.usuario; const d = new Date(m.created_at); const tStr = `${d.getDate()}/${d.getMonth()+1} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
                    let reacts = m.reacoes || {}; let reactHtml = ''; ['👍', '❤️', '😂', '🔥'].forEach(em => { const c = reacts[em]||0; reactHtml += `<div class="reaction-btn" onclick="addReaction('${m.id}', '${em}')">${em} <span style="font-size:0.7rem;">${c>0?c:''}</span></div>`; });
                    let textMsg = m.mensagem.replace(/@(\w+)/g, '<span class="mention">@$1</span>');
                    
                    // Exibir avatar oficial no chat baseando-se no allUsers atualizado
                    const uInfo = allUsers.find(u => u.usuario === m.usuario); const defAv = `https://ui-avatars.com/api/?name=${encodeURIComponent(m.usuario)}&background=0ea5e9&color=fff`;
                    const avaUrl = uInfo && uInfo.avatar_url ? uInfo.avatar_url : defAv;

                    cont.innerHTML += `
                    <div class="chat-msg ${isMe?'my-msg':''}">
                        <div class="chat-author" style="display:flex; align-items:center; gap:8px;">
                            ${!isMe ? `<img src="${avaUrl}" style="width:20px; height:20px; border-radius:50%; object-fit:cover;">` : ''}
                            <span>${m.usuario}</span> <span class="chat-date">${tStr}</span>
                            ${isMe ? `<img src="${avaUrl}" style="width:20px; height:20px; border-radius:50%; object-fit:cover;">` : ''}
                        </div>
                        <div style="margin-top:5px;">${textMsg}</div>
                        <div class="chat-reactions">${reactHtml}</div>
                    </div>`;
                });
                cont.scrollTop = cont.scrollHeight;
            } catch(e) { cont.innerHTML = '<p style="color:var(--danger); text-align:center;">Erro ao carregar chat.</p>'; }
        }

        function handleChatMentions(e) {
            const input = e.target; const val = input.value; const drop = document.getElementById('mentionsDropdown');
            if(e.key === 'Enter') { sendChatMessage(); drop.classList.remove('active'); return; }
            const lastWord = val.split(' ').pop();
            if(lastWord.startsWith('@')) {
                const search = lastWord.substring(1).toLowerCase(); const matched = allUsers.filter(u => u.usuario.toLowerCase().includes(search));
                if(matched.length > 0) { drop.innerHTML = ''; matched.forEach(m => { drop.innerHTML += `<div class="mention-item" onclick="insertMention('${m.usuario}')"><i class="fas fa-user-circle"></i> ${m.usuario}</div>`; }); drop.classList.add('active'); } else { drop.classList.remove('active'); }
            } else { drop.classList.remove('active'); }
        }
        function insertMention(username) { const input = document.getElementById('chat-input'); const words = input.value.split(' '); words.pop(); input.value = words.join(' ') + (words.length > 0 ? ' ' : '') + `@${username} `; document.getElementById('mentionsDropdown').classList.remove('active'); input.focus(); }

        async function sendChatMessage() {
            const inp = document.getElementById('chat-input'); const msg = inp.value.trim(); if(!msg || !selectedVaga) return; inp.value = ''; document.getElementById('mentionsDropdown').classList.remove('active');
            try { await fetch(`${SUPABASE_URL}/chat_vagas`, { method: 'POST', headers, body: JSON.stringify({ id_vaga: selectedVaga.id, usuario: currentUser.usuario, mensagem: msg }) }); reloadChat(); } catch(e) { showToast("Erro.",true); }
        }

        async function addReaction(msgId, emoji) {
            try {
                const res = await fetch(`${SUPABASE_URL}/chat_vagas?id=eq.${msgId}&select=reacoes`, { headers }); const data = await res.json(); let r = data[0].reacoes || {}; r[emoji] = (r[emoji] || 0) + 1;
                await fetch(`${SUPABASE_URL}/chat_vagas?id=eq.${msgId}`, { method: 'PATCH', headers, body: JSON.stringify({ reacoes: r }) }); reloadChat();
            } catch(e) {}
        }

        function openActionModal(e, id) {
            if(e) e.stopPropagation();
            selectedVaga = rawData.find(v => v.id == id); const st = selectedVaga.status_vaga;
            const c = document.getElementById('action-buttons-container'); document.getElementById('action-form-container').style.display = 'none';
            document.getElementById('actionModalTitle').innerHTML = `<i class="fas fa-bolt" style="color:var(--primary)"></i> Opções: ${selectedVaga.cargo_vaga_setor}`; c.innerHTML = '';

            // Seção de Propriedade & Grupo (sempre visível, independente do status)
            const semDono = !selectedVaga.recrutadora_responsavel || selectedVaga.recrutadora_responsavel.trim() === '';
            const souDono = (selectedVaga.recrutadora_responsavel || '').toLowerCase() === (currentUser.usuario || '').toLowerCase();
            let propHtml = `<div style="background:var(--bg-base); border:1px solid var(--border-color); border-radius:12px; padding:12px; margin-bottom:5px;">
                <div style="font-size:0.75rem; color:var(--text-muted); text-transform:uppercase; font-weight:700; margin-bottom:8px;"><i class="fas fa-user-tag"></i> Propriedade ${selectedVaga.grupo_atribuido ? `· Grupo: ${selectedVaga.grupo_atribuido}` : '· Sem grupo (aberta a todos)'}</div>
                <div style="display:flex; gap:8px; flex-wrap:wrap;">`;
            if (semDono) {
                propHtml += `<button class="btn btn-primary" style="padding:8px 14px; font-size:0.8rem;" onclick="assumirVaga('${selectedVaga.id}')"><i class="fas fa-hand-paper"></i> Assumir Vaga</button>`;
            } else {
                propHtml += `<button class="btn btn-secondary" style="padding:8px 14px; font-size:0.8rem;" onclick="openTransferModal('${selectedVaga.id}')"><i class="fas fa-exchange-alt"></i> Transferir</button>`;
                if (!souDono && !isUserAdmin(currentUser)) {
                    propHtml += `<button class="btn btn-secondary" style="padding:8px 14px; font-size:0.8rem;" onclick="bulkActionSingle('${selectedVaga.id}', 'propriedade')"><i class="fas fa-hand-paper"></i> Solicitar Propriedade</button>`;
                }
            }
            propHtml += `<button class="btn btn-danger" style="padding:8px 14px; font-size:0.8rem;" onclick="bulkActionSingle('${selectedVaga.id}', 'exclusao')"><i class="fas fa-trash"></i> ${isUserAdmin(currentUser) ? 'Excluir' : 'Solicitar Exclusão'}</button>`;
            propHtml += `</div></div><hr style="border:0; border-top:1px solid var(--border-color); margin: 12px 0;">`;
            c.innerHTML += propHtml;

            if (st === 'Aberta' || !st) {
                c.innerHTML += `<button class="btn btn-primary" style="padding:15px; font-size:1rem;" onclick="setupActionForm('FECHAR')"><i class="fas fa-check-circle"></i> Fechar Vaga / Add Admissão</button>`;
                c.innerHTML += `<button class="btn btn-warning" style="padding:15px; font-size:1rem;" onclick="setupActionForm('STANDBY_IN')"><i class="fas fa-pause"></i> Iniciar Stand-by</button>`;
                c.innerHTML += `<button class="btn btn-danger" style="padding:15px; font-size:1rem;" onclick="setupActionForm('CANCELAR')"><i class="fas fa-times-circle"></i> Cancelar Vaga</button>`;
            } 
            else if (st === 'Stand-by') { c.innerHTML += `<button class="btn btn-primary" style="padding:15px;" onclick="executeQuickStatus('Aberta')"><i class="fas fa-play"></i> Encerrar Stand-by</button>`; c.innerHTML += `<button class="btn btn-danger" style="padding:15px;" onclick="setupActionForm('CANCELAR')"><i class="fas fa-times-circle"></i> Cancelar Vaga</button>`; }
            else if (st === 'Cancelada') { c.innerHTML += `<button class="btn btn-primary" style="padding:15px;" onclick="executeQuickStatus('Aberta')"><i class="fas fa-undo"></i> Reverter Cancelamento</button>`; }
            else if (st === 'Aguardando Admissão') { c.innerHTML += `<button class="btn btn-primary" style="padding:15px;" onclick="setupActionForm('CONCLUIR_ADM')"><i class="fas fa-check-double"></i> Concluir Fechamento</button>`; c.innerHTML += `<button class="btn btn-warning" style="padding:15px;" onclick="setupActionForm('DESISTENCIA')"><i class="fas fa-user-times"></i> Registrar Desistência</button>`; c.innerHTML += `<button class="btn btn-danger" style="padding:15px;" onclick="setupActionForm('CANCELAR')"><i class="fas fa-times-circle"></i> Cancelar Vaga</button>`; }
            else if (st === 'Fechada' || st === 'Desistência') { c.innerHTML += `<div style="text-align:center; padding: 20px; background:rgba(0,0,0,0.02); border-radius:12px; color:var(--text-main);"><i class="fas fa-lock" style="font-size:2rem; color:var(--text-muted); margin-bottom:10px;"></i><br>Vaga finalizada (${st}).</div>`; }
            document.getElementById('actionModal').classList.add('active');
        }

        // Versão de bulkAction pra uma única vaga (chamada a partir do modal de ações)
        async function bulkActionSingle(id, tipo) {
            selectedVagas = new Set([id]);
            await bulkAction(tipo);
            document.getElementById('actionModal').classList.remove('active');
        }


        async function executeQuickStatus(newStatus) { 
            try {
                await patchSupabase('vagas', `id=eq.${selectedVaga.id}`, { status_vaga: newStatus });

                showToast("Atualizado!"); 
                document.getElementById('actionModal').classList.remove('active'); 
                loadVagas(false); 
            } catch(e) { 
                console.error("Supabase Error:", e);
                showToast("Erro: " + e.message, true); 
            } 
        }

        function setupActionForm(type) {
            currentActionType = type; selectedFile = null; document.getElementById('action-buttons-container').innerHTML = ''; const form = document.getElementById('action-form-container'); form.style.display = 'block';
            if (type === 'CANCELAR' || type === 'DESISTENCIA') { form.innerHTML = `<div class="form-group"><label>Justificativa Obrigatória</label><textarea id="inpJustificativa" rows="3"></textarea></div><button class="btn btn-danger" id="btnSubmitAction" onclick="submitActionForm()" style="width:100%; padding:15px;">Confirmar</button>`; } 
            else if (type === 'STANDBY_IN') { form.innerHTML = `<div class="form-group"><label>Motivo do Stand-By</label><input type="text" id="inpJustificativa"></div><button class="btn btn-warning" id="btnSubmitAction" onclick="submitActionForm()" style="width:100%; padding:15px;">Pausar Vaga</button>`; }
            else if (type === 'FECHAR' || type === 'CONCLUIR_ADM') {
                form.innerHTML = `
                <div class="form-group"><label>Nome do Candidato *</label><input type="text" id="inpCandidato" value="${selectedVaga.nome_candidato || ''}"></div>
                <div class="form-group"><label>Anexo (Upload S3) *</label> ${selectedVaga.mailto_anexo_url ? `<p style="font-size:0.8rem; color:var(--success);"><i class="fas fa-check"></i> Já anexado</p>` : ''}<div class="file-upload-wrapper"><span id="fileNameDisplay"><i class="fas fa-upload"></i> Selecionar Arquivo</span><input type="file" id="inpMailtoFile" accept=".msg,.eml,.pdf,.jpg,.png" onchange="handleFileSelect(event)"></div></div>
                <div class="grid-2-cols" style="background:rgba(0,0,0,0.02); padding:15px; border-radius:12px; margin-bottom:15px;">
                    <div style="grid-column: 1 / -1;"><p style="font-size:0.8rem; color:var(--text-muted);">Preencha ambos para <b>Fechar</b>. Em branco = <b>Ag. Admissão</b>.</p></div>
                    <div class="form-group" style="margin:0;"><label>Matrícula</label><input type="text" id="inpMatricula" value="${selectedVaga.matricula_candidato || ''}"></div>
                    <div class="form-group" style="margin:0;"><label>Admissão (Data)</label><input type="date" id="inpDataAdm" value="${selectedVaga.data_admissao_candidato || ''}"></div>
                </div>
                <button class="btn btn-primary" id="btnSubmitAction" onclick="submitActionForm()" style="width:100%; padding:15px;">Salvar Operação</button>`;
            }
        }
        function handleFileSelect(e) { const f = e.target.files[0]; if(f) { selectedFile = f; document.getElementById('fileNameDisplay').innerHTML = `<i class="fas fa-file"></i> ${f.name}`; } }

        async function submitActionForm() {
            let payload = {}; 
            const btn = document.getElementById('btnSubmitAction'); 
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processando...'; 
            btn.disabled = true;
            
            if (currentActionType === 'CANCELAR' || currentActionType === 'DESISTENCIA') {
                const just = document.getElementById('inpJustificativa').value.trim(); 
                if (!just) { showToast("Justificativa obrigatória", true); btn.innerHTML='Confirmar'; btn.disabled=false; return; }
                payload = { status_vaga: currentActionType === 'CANCELAR' ? 'Cancelada' : 'Desistência', justificativa_status: just, data_fechamento: new Date().toISOString().split('T')[0] };
            }
            else if (currentActionType === 'STANDBY_IN') { 
                payload = { status_vaga: 'Stand-by', justificativa_status: document.getElementById('inpJustificativa').value.trim() || null }; 
            }
            else if (currentActionType === 'FECHAR' || currentActionType === 'CONCLUIR_ADM') {
                const cand = document.getElementById('inpCandidato').value.trim(); 
                const mat = document.getElementById('inpMatricula').value.trim(); 
                const dataAdm = document.getElementById('inpDataAdm').value;

                if (!cand) { showToast("Candidato obrigatório", true); btn.innerHTML='Salvar Operação'; btn.disabled=false; return; }
                if (!selectedFile && !selectedVaga.mailto_anexo_url) { showToast("Anexo obrigatório", true); btn.innerHTML='Salvar Operação'; btn.disabled=false; return; }

                payload = { nome_candidato: cand };
                
                if(selectedFile) {
                    try { 
                        const safeName = selectedFile.name.replace(/[^a-zA-Z0-9.\-]/g, '_');
                        const fName = `${selectedVaga.id}_${Date.now()}_${safeName}`; 
                        
                        await s3Client.putObject({ Bucket: 'anexos_sla', Key: fName, Body: selectedFile, ContentType: selectedFile.type || 'application/octet-stream' }).promise();
                        payload.mailto_anexo_url = `https://ueicrehzfrwewgteqxvi.supabase.co/storage/v1/object/public/anexos_sla/${fName}`; 
                    } catch(e) { 
                        console.error(e); showToast("Erro upload anexo no S3.", true); btn.innerHTML='Salvar Operação'; btn.disabled=false; return; 
                    }
                }
                
                if (mat && dataAdm) { 
                    payload.status_vaga = 'Fechada'; 
                    payload.matricula_candidato = mat; 
                    payload.data_admissao_candidato = dataAdm; 
                    payload.data_fechamento = new Date().toISOString().split('T')[0]; 
                } else { 
                    payload.status_vaga = 'Aguardando Admissão'; 
                    payload.matricula_candidato = mat || null;
                    payload.data_admissao_candidato = dataAdm || null;
                }
            }
            
            try { 
                await patchSupabase('vagas', `id=eq.${selectedVaga.id}`, payload); 

                document.getElementById('actionModal').classList.remove('active'); 
                showToast("Atualizado!"); 
                
                if(payload.status_vaga === 'Fechada' || payload.status_vaga === 'Cancelada' || payload.status_vaga === 'Desistência') { setTabFilter('fechadas'); } 
                else { setTabFilter('ativas'); }
                
                loadVagas(false); 
                if(payload.status_vaga === 'Fechada') { 
                    document.getElementById('gamiEmoji').innerText = currentUser.emoji_vitoria || '🎉'; 
                    document.getElementById('gamificationModal').classList.add('active'); 
                    confetti({ particleCount: 200, spread: 90, zIndex: 4000 }); 
                } 
            } catch(e) { 
                console.error(e);
                showToast("Erro: " + e.message, true); 
            } finally {
                btn.innerHTML='Salvar Operação';
                btn.disabled=false;
            }
        }

        // --- DASHBOARDS & RELATÓRIOS (APLICADOS AO USERRAWDATA) ---
        const DASH_FILTER_MAP = { dFiltroDir: 'diretor', dFiltroDistrital: 'distrital', dFiltroCoord: 'coordenador', dFiltroRec: 'recrutadora_responsavel', dFiltroStat: 'status_vaga' };

        // Aplica todos os filtros do dashboard já selecionados, exceto o de excluirId —
        // mesma lógica da tabela principal: cada dropdown reage aos outros, mas nunca
        // se auto-restringe.
        function getDashFilteredBase(excluirId) {
            let dData = getUserRawData();
            Object.keys(DASH_FILTER_MAP).forEach(selId => {
                if (selId === excluirId) return;
                const val = document.getElementById(selId).value;
                if (val) dData = dData.filter(v => v[DASH_FILTER_MAP[selId]] === val);
            });
            const fData = document.getElementById('dFiltroData').value;
            if (fData && excluirId !== 'dFiltroData') { dData = dData.filter(v => { const dt = v.data_abertura_vaga || v.data_solicitacao || ''; return dt.startsWith(fData); }); }
            return dData;
        }

        function populateDashFilters() {
            const getOpts = (selId, campo, label) => {
                const atual = document.getElementById(selId).value;
                const base = getDashFilteredBase(selId);
                let opts = [...new Set(base.map(v => v[campo]).filter(Boolean))];
                if (atual && !opts.includes(atual)) opts.push(atual); // não perde a seleção atual do ar
                opts.sort();
                return `<option value="">${label}</option>` + opts.map(a => `<option value="${a}" ${a === atual ? 'selected' : ''}>${a}</option>`).join('');
            };
            document.getElementById('dFiltroDir').innerHTML = getOpts('dFiltroDir', 'diretor', 'Diretor (Todos)');
            document.getElementById('dFiltroDistrital').innerHTML = getOpts('dFiltroDistrital', 'distrital', 'Distrital (Todos)');
            document.getElementById('dFiltroCoord').innerHTML = getOpts('dFiltroCoord', 'coordenador', 'Coordenador (Todos)');
            document.getElementById('dFiltroRec').innerHTML = getOpts('dFiltroRec', 'recrutadora_responsavel', 'Recrutadora (Todas)');
            document.getElementById('dFiltroStat').innerHTML = getOpts('dFiltroStat', 'status_vaga', 'Status (Todos)');
        }

        function openChartModal() { document.getElementById('chartModal').classList.add('active'); populateDashFilters(); updateDashboard(); }
        
        function updateDashboard() {
            let dData = getDashFilteredBase(null); // todos os filtros aplicados juntos
            document.getElementById('d-val-fechadas').innerText = dData.filter(v => v.status_vaga === 'Fechada').length;
            document.getElementById('d-val-adm').innerText = dData.filter(v => v.status_vaga === 'Aguardando Admissão').length;
            document.getElementById('d-val-pend').innerText = dData.filter(v => !['Fechada', 'Aguardando Admissão'].includes(v.status_vaga)).length;

            const uniqueRecs = [...new Set(dData.map(v => v.recrutadora_responsavel).filter(Boolean))];
            const groupBy = uniqueRecs.length > 1 ? 'recrutadora_responsavel' : 'nome_filial_setor';
            document.getElementById('dashChartTitle').innerText = uniqueRecs.length > 1 ? 'SLA Médio por Recrutadora' : 'SLA Médio por Filial/Setor';

            const recStats = {};
            dData.forEach(v => { 
                const key = v[groupBy] || 'Não Atribuído'; 
                if(!recStats[key]) recStats[key] = { totalSla: 0, count: 0 }; 
                recStats[key].totalSla += (v.current_sla || 0); recStats[key].count++; 
            });

            const labels = Object.keys(recStats);
            const avgs = labels.map(l => (recStats[l].totalSla / recStats[l].count).toFixed(1));

            const ctx = document.getElementById('recruiterChart').getContext('2d');
            if(mainChart) mainChart.destroy();
            
            const textColor = getComputedStyle(document.body).getPropertyValue('--text-main').trim();
            const chartColor = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim() || '#0ea5e9';
            Chart.defaults.font.family = getComputedStyle(document.documentElement).getPropertyValue('--font-family');
            
            mainChart = new Chart(ctx, {
                type: 'bar',
                data: { labels: labels, datasets: [ { label: 'SLA Médio (Dias)', data: avgs, backgroundColor: chartColor, borderRadius: 4 } ] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: textColor } } }, scales: { y: { display: false }, x: { grid: { display: false }, ticks: { color: textColor } } } } 
            });
        }

        async function downloadDashboard(e) {
            const btn = e.currentTarget; const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Gerando...'; btn.disabled = true;
            const element = document.getElementById('dashExportArea');
            try {
                const canvas = await html2canvas(element, { backgroundColor: getComputedStyle(element).backgroundColor });
                const link = document.createElement('a'); link.download = 'Dashboard_SLA.png'; link.href = canvas.toDataURL(); link.click();
            } catch(err) { showToast("Erro ao exportar dashboard", true); }
            btn.innerHTML = originalHTML; btn.disabled = false;
        }

        function openPerformanceSummary() {
            document.getElementById('perfModal').classList.add('active');
            renderPerfCards();
        }

        function toggleCustomPerfDate() {
            const p = document.getElementById('perfPeriod').value;
            if(p === 'custom') { document.getElementById('perfStart').style.display = 'block'; document.getElementById('perfEnd').style.display = 'block'; }
            else { document.getElementById('perfStart').style.display = 'none'; document.getElementById('perfEnd').style.display = 'none'; renderPerfCards(); }
        }

        function renderPerfCards() {
            const period = document.getElementById('perfPeriod').value;
            let dData = getUserRawData(); 

            const now = new Date();
            if(period === 'mes_atual') {
                const ym = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
                dData = dData.filter(v => { const d = v.data_abertura_vaga || v.data_solicitacao || ''; return d.startsWith(ym); });
            } else if(period === 'mes_passado') {
                const past = new Date(now.getFullYear(), now.getMonth()-1, 1);
                const ym = `${past.getFullYear()}-${String(past.getMonth()+1).padStart(2,'0')}`;
                dData = dData.filter(v => { const d = v.data_abertura_vaga || v.data_solicitacao || ''; return d.startsWith(ym); });
            } else if(period === 'ano') {
                const y = `${now.getFullYear()}`;
                dData = dData.filter(v => { const d = v.data_abertura_vaga || v.data_solicitacao || ''; return d.startsWith(y); });
            } else if(period === 'custom') {
                const start = document.getElementById('perfStart').value;
                const end = document.getElementById('perfEnd').value;
                if(start && end) { dData = dData.filter(v => { const d = v.data_abertura_vaga || v.data_solicitacao || ''; return d >= start && d <= end; }); }
            }

            const stats = {};
            dData.forEach(v => {
                const semDono = !v.recrutadora_responsavel || v.recrutadora_responsavel.trim() === '';
                const rec = !semDono ? v.recrutadora_responsavel : (v.grupo_atribuido ? `Grupo: ${v.grupo_atribuido}` : 'Vaga Não Atribuída');
                if(!stats[rec]) {
                    stats[rec] = { total: 0, isGrupo: semDono, status: { 'Fechada':0, 'Aberta':0, 'Aguardando Admissão':0, 'Stand-by':0, 'Cancelada':0, 'Desistência':0 }, minSla: 9999, maxSla: 0, sumSla: 0 };
                }
                stats[rec].total++;
                const st = v.status_vaga || 'Aberta';
                if(stats[rec].status[st] !== undefined) stats[rec].status[st]++;
                
                const sla = v.current_sla || 0;
                stats[rec].sumSla += sla;
                if(sla < stats[rec].minSla) stats[rec].minSla = sla;
                if(sla > stats[rec].maxSla) stats[rec].maxSla = sla;
            });

            const deck = document.getElementById('perfDeck');
            deck.innerHTML = '';
            
            if(Object.keys(stats).length === 0) {
                deck.innerHTML = '<p style="color:var(--text-muted); width:100%; text-align:center;">Nenhum dado encontrado para o período.</p>';
                return;
            }

            for(let rec in stats) {
                const s = stats[rec];
                if(s.minSla === 9999) s.minSla = 0;
                
                const getPct = (val) => s.total > 0 ? ((val / s.total) * 100).toFixed(0) : 0;
                const avgSla = s.total > 0 ? (s.sumSla / s.total).toFixed(1) : 0;
                
                // Usando a foto do cache atualizado
                const uInfo = allUsers.find(u => u.usuario === rec);
                const ava = uInfo && uInfo.avatar_url ? uInfo.avatar_url : `https://ui-avatars.com/api/?name=${encodeURIComponent(rec)}&background=random&color=fff&size=300&font-size=0.33`;

                deck.innerHTML += `
                    <div class="deck-card">
                        <img class="deck-card-img" src="${ava}" alt="Foto ${rec}">
                        <div class="deck-card-body">
                            <div class="deck-card-dept">Recrutamento e Seleção</div>
                            <div class="deck-card-name">${rec}</div>
                            <div class="deck-card-role">Volumetria Operacional: ${s.total} Vagas</div>

                            <div class="deck-card-status-list">
                                <div class="deck-card-status-item">
                                    <span>Fechadas</span> 
                                    <b style="color:var(--success)">${s.status['Fechada']} (${getPct(s.status['Fechada'])}%)</b>
                                </div>
                                <div class="deck-card-status-item">
                                    <span>Ag. Admissão</span> 
                                    <b style="color:var(--st-admissao)">${s.status['Aguardando Admissão']} (${getPct(s.status['Aguardando Admissão'])}%)</b>
                                </div>
                                <div class="deck-card-status-item">
                                    <span>Em Tratativa</span> 
                                    <b style="color:var(--primary)">${s.status['Aberta']} (${getPct(s.status['Aberta'])}%)</b>
                                </div>
                                <div class="deck-card-status-item" style="border:none;">
                                    <span>Perdas (Canc/Des.)</span> 
                                    <b style="color:var(--danger)">${s.status['Cancelada'] + s.status['Desistência']} (${getPct(s.status['Cancelada'] + s.status['Desistência'])}%)</b>
                                </div>
                            </div>

                            <div class="deck-card-slas">
                                <div class="deck-sla-badge" style="color:var(--primary)">SLA Médio <b>${avgSla}d</b></div>
                                <div class="deck-sla-badge" style="color:var(--success)">Mínimo <b>${s.minSla}d</b></div>
                                <div class="deck-sla-badge" style="color:var(--danger)">Máximo <b>${s.maxSla}d</b></div>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        // EXPORTAÇÕES
        function openExportModal() { document.getElementById('exportModal').classList.add('active'); }

        function exportRelatorioVagas(e) {
            const btn = e.currentTarget; const originalHtml = btn.innerHTML; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processando...';
            setTimeout(() => {
                const dataToExport = filteredData.map(v => ({
                    'ID': v.id, 'Status': v.status_vaga, 'SLA Atual (Dias)': v.current_sla, 'Meta SLA': v.meta_sla,
                    'Recrutadora': v.recrutadora_responsavel, 'Data Abertura': formatDataBR(v.data_abertura_vaga || v.data_solicitacao),
                    'Data Fechamento': formatDataBR(v.data_fechamento), 'Diretor': v.diretor, 'Distrital': v.distrital, 'Coordenador': v.coordenador,
                    'Filial/Setor': v.nome_filial_setor, 'Cargo': v.cargo_vaga_setor, 'Solicitante': v.nome_solicitante,
                    'Candidato': v.nome_candidato, 'Matrícula': v.matricula_candidato, 'Data Admissão': formatDataBR(v.data_admissao_candidato),
                    'Currículos': v.curriculos
                }));
                const ws = XLSX.utils.json_to_sheet(dataToExport); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Relatório"); 
                XLSX.writeFile(wb, `Relatorio_Vagas_${new Date().toISOString().split('T')[0]}.xlsx`); 
                document.getElementById('exportModal').classList.remove('active'); btn.innerHTML = originalHtml; showToast("Exportado com sucesso!");
            }, 500);
        }

        function exportDesempenho(e) {
            const btn = e.currentTarget; const originalHtml = btn.innerHTML; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processando...';
            setTimeout(() => {
                const stats = {};
                filteredData.forEach(v => {
                    const rec = v.recrutadora_responsavel || 'Não Atribuído';
                    if(!stats[rec]) stats[rec] = { 'Recrutadora': rec, 'Total Vagas':0, 'Fechadas':0, 'Abertas':0, 'Ag. Admissão':0, 'Canceladas/Desistências':0, 'SLA Somado':0 };
                    stats[rec]['Total Vagas']++;
                    const st = v.status_vaga || 'Aberta';
                    if(st === 'Fechada') stats[rec]['Fechadas']++; else if(st === 'Aguardando Admissão') stats[rec]['Ag. Admissão']++; else if(st === 'Cancelada' || st === 'Desistência') stats[rec]['Canceladas/Desistências']++; else stats[rec]['Abertas']++;
                    stats[rec]['SLA Somado'] += (v.current_sla || 0);
                });
                const dataToExport = Object.values(stats).map(s => { const total = s['Total Vagas']; return { 'Recrutadora': s['Recrutadora'], 'Total Vagas Visíveis': total, 'Fechadas': s['Fechadas'], 'Abertas (Pendentes)': s['Abertas'], 'Ag. Admissão': s['Ag. Admissão'], 'Canceladas/Desistências': s['Canceladas/Desistências'], 'Conversão (%)': total > 0 ? ((s['Fechadas']/total)*100).toFixed(1) + '%' : '0%', 'SLA Médio (Dias)': total > 0 ? (s['SLA Somado']/total).toFixed(1) : 0 }; });
                const ws = XLSX.utils.json_to_sheet(dataToExport); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Desempenho"); 
                XLSX.writeFile(wb, `Desempenho_Recrutadoras_${new Date().toISOString().split('T')[0]}.xlsx`); 
                document.getElementById('exportModal').classList.remove('active'); btn.innerHTML = originalHtml; showToast("Exportado com sucesso!");
            }, 500);
        }

        function exportOperacional(e) {
            const btn = e.currentTarget; const originalHtml = btn.innerHTML; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processando...';
            setTimeout(() => {
                const stats = {};
                filteredData.forEach(v => {
                    const key = `${v.nome_filial_setor || 'N/A'} - ${v.cargo_vaga_setor || 'N/A'}`;
                    if(!stats[key]) stats[key] = { 'Filial/Setor': v.nome_filial_setor, 'Cargo': v.cargo_vaga_setor, 'Volumetria':0, 'SLA Somado':0, 'Fechadas':0 };
                    stats[key]['Volumetria']++; stats[key]['SLA Somado'] += (v.current_sla || 0);
                    if(v.status_vaga === 'Fechada') stats[key]['Fechadas']++;
                });
                const dataToExport = Object.values(stats).map(s => ({ 'Filial / Setor': s['Filial/Setor'], 'Cargo': s['Cargo'], 'Volumetria Total': s['Volumetria'], 'Vagas Fechadas': s['Fechadas'], 'SLA Médio (Dias)': s['Volumetria'] > 0 ? (s['SLA Somado']/s['Volumetria']).toFixed(1) : 0 }));
                const ws = XLSX.utils.json_to_sheet(dataToExport); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Operacional"); 
                XLSX.writeFile(wb, `Resumo_Operacional_${new Date().toISOString().split('T')[0]}.xlsx`); 
                document.getElementById('exportModal').classList.remove('active'); btn.innerHTML = originalHtml; showToast("Exportado com sucesso!");
            }, 500);
        }

        function showToast(msg, isError = false) { const t = document.getElementById('toast'); t.innerHTML = `<i class="fas ${isError ? 'fa-times-circle' : 'fa-check-circle'}"></i> ${msg}`; t.className = isError ? 'error show' : 'show'; setTimeout(() => t.className = '', 4000); }
    </script>
</body>
</html>
